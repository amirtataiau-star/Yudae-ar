tems:center;gap:12px}.progress{display:flex;gap:6px;flex-shrink:0}.progress i{display:block;width:17px;height:4px;border-radius:4px;background:#5b666b}.progress i.on{background:var(--accent)}.sketch{border-radius:12px;background:#333a3b;border:1px solid #616866;overflow:hidden;margin:18px 0 24px;height:clamp(166px,30vw,230px)}.sketch svg{width:100%;height:100%;display:block}.fold{border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:15px 0;background:#242d31}.fold summary{cursor:pointer;color:var(--accent);font-weight:600}.fold[open] summary{margin-bottom:15px}.fold p{font-size:14px;margin:10px 0}.entangle{padding:14px 17px;border:1px solid #9c8073;background:#332e2c;border-radius:11px;margin:13px 0}.entangle strong{display:block;margin:6px 0}.entangle p{font-size:14px;color:#e8dcd3;margin:0}.copy{max-width:690px;font-size:17px}.quote{padding:14px 18px;border-left:2px solid var(--pink);background:rgba(210,190,185,.06);font-size:18px;font-style:italic;margin:21px 0}.label{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--mint);margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:11px;margin:20px 0}.btn{min-height:49px;border:1px solid #9da8a6;background:transparent;border-radius:10px;padding:12px 17px;font-weight:bold;text-align:left}.btn:hover{background:#354044}.btn.primary{background:var(--accent);color:#202529;border-color:var(--accent)}.btn.primary:hover{background:#f9e2b7}.btn.inline{display:inline-block}.btn.small{font-weight:normal;font-size:13px;min-height:40px;padding:8px 12px}.btnbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btnbar .primary{order:0}.choice{border:1px solid #637077;border-radius:14px;background:var(--paper);padding:18px 17px;margin:14px 0}.choice h3{font-size:19px;font-weight:600;line-height:1.28}.choice p{font-size:15px;color:#e0e2dc}.choice .btn{width:100%;margin-top:8px}.smallline{font-size:13px;color:var(--dim)}.tag{display:inline-block;border:1px solid #76817c;color:#d7ddd5;border-radius:30px;font-size:12px;padding:3px 10px;margin:2px 3px 4px 0}.reflection{display:grid;gap:8px}.field{border:1px solid #84928f;background:#11191c;border-radius:11px;color:var(--ink);width:100%;padding:12px;font-size:16px;min-height:92px;resize:vertical}.switch{display:flex;gap:12px;align-items:flex-start}.switch input{width:20px;height:20px;accent-color:var(--mint);margin-top:3px}.switch label{font-size:14px}.readout{border-left:3px solid var(--mint);padding-left:16px;margin:18px 0}.readout strong{font-size:14px}.impact{border-bottom:1px solid var(--line);padding:14px 0}.impact:last-child{border-bottom:0}.impact .eyebrow{color:var(--accent)}.steps{padding-left:22px}.steps li{margin:0 0 8px}.source a{font-size:13px}.source{margin:8px 0}.modalwrap{position:fixed;inset:0;background:rgba(8,13,17,.88);display:grid;place-items:center;z-index:10;padding:13px}.modal{width:min(100%,720px);max-height:93dvh;overflow:auto;background:#253036;border:1px solid #82908a;border-radius:15px;padding:22px}.modal .close{position:sticky;top:0;float:right;background:#222b30;border:1px solid var(--line);border-radius:50px;padding:7px 14px;margin:-5px -5px 10px 8px}.portrait{width:60px;height:64px;border-radius:8px;background:linear-gradient(145deg,#5c6668,#242d30);display:flex;align-items:center;justify-content:center;font-size:25px;color:var(--accent);flex-shrink:0;border:1px solid #7e8886}.person{display:flex;gap:16px;border-bottom:1px solid var(--line);padding:14px 0}.person:last-child{border-bottom:none}.person p{font-size:14px;margin:3px 0 8px}.person strong{font-size:16px}.help{color:var(--dim);font-size:14px}.modal h2{font-size:2rem}.disclose{padding:12px 0}.disclose button{background:transparent;border:1px solid var(--line);padding:9px 12px;border-radius:9px;text-align:left;width:100%}.disclose p{margin-top:10px}.log{padding:15px 0;border-bottom:1px solid var(--line)}.log:last-child{border:0}.checkboxrow{display:flex;gap:10px;align-items:flex-start;margin:15px 0}.checkboxrow input{width:20px;height:20px;accent-color:var(--mint)}.pillstrip{padding:15px 0;margin-bottom:8px}.banner{background:#2b3638;border-left:3px solid #9fc5b8;padding:12px 15px;font-size:14px;border-radius:4px}.status{color:var(--mint);font-size:13px;min-height:18px}.smallcaps{font-variant:small-caps;color:var(--accent);letter-spacing:.04em}@media(max-width:500px){.shell{padding:0 15px 44px}.scenehead{align-items:flex-start}.top{padding:13px 0}.logo{font-size:11px}.panel{padding:17px}.sketch{margin:16px 0}.modal{padding:16px}.btnbar{display:grid}.btnbar .btn{width:100%}.choice{padding:15px}.copy{font-size:16px}.modal h2{font-size:1.7rem}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}@media print{.topbtns,.btnbar,button{display:none!important}body{background:white;color:black}a{color:black}}

const PEOPLE={"ari":{"name":"Ari Bell","role":"Head of Education and Participation","initial":"AB","value":"Protect meaningful learning and the people who make it possible.","strain":"Absorbs unresolved work to stop it reaching others.","room":"Can recommend priorities and allocate work within a limited education budget; cannot authorise venue access, guarantee new funds or decide a confidential staff process.","agency":"Can refuse an uncosted launch, ask for written authorization, and raise safety concerns. Cannot compel trust or delegate employer duties away."},"mika":{"name":"Mika Chen","role":"Learning producer","initial":"MC","value":"Wants creative ownership, progression and work they can be proud to show.","strain":"Has twice prepared ambitious concepts that were credited primarily to more senior colleagues.","room":"Can design and negotiate production; cannot commit other teams or guarantee staffing.","agency":"May apply for an external post, decline to champion a pitch without due attribution, or continue designing while questioning whether anyone will back them."},"nadia":{"name":"Nadia Singh","role":"Venue operations manager","initial":"NS","value":"Reliable, safe conditions for the people who work and visit.","strain":"Has been carrying urgent operational changes while teams keep treating exceptions as ordinary.","room":"Can approve feasible venue arrangements within operational requirements; cannot waive essential checks.","agency":"May withhold access until checks are completed and put recurrent approval failures into a formal operational review, even if criticised for slowing delivery."},"jules":{"name":"Jules Torres","role":"Independent teaching artist","initial":"JT","value":"Fairly paid artistic labour and ambitious participatory work.","strain":"Has a portfolio of short contracts and rarely knows next month’s income.","room":"Can accept, decline or renegotiate an engagement; cannot commit to unlimited preparation.","agency":"May decline an unfunded extension or seek contractual advice; their agreement is not guaranteed by the educational value of the work."},"tahlia":{"name":"Tahlia Ward","role":"Education access coordinator","initial":"TW","value":"Real access rather than a promise printed in a brochure.","strain":"Part-time hours conceal full-time coordination expectations.","room":"Can advise on access plans and raise workload concerns; cannot create additional hours or approve unsafe workarounds.","agency":"May set a boundary on hours and use consultation or reporting channels; privacy and support are separate from the employer’s duty to address hazardous work."},"morgan":{"name":"Morgan Ellis","role":"Executive program sponsor","initial":"ME","value":"Visible public benefit from major investment, including credible education outcomes.","strain":"Faces funding expectations and competing demands for a finite budget.","room":"Can recommend governance priorities and authorise some resources; cannot replace OHS consultation or promise resources not approved.","agency":"May reject a proposal that lacks accountable costings; may also be answerable to public visibility pressures that Ari cannot remove."},"sofia":{"name":"Sofia Reid","role":"People and safety adviser","initial":"SR","value":"Trustworthy processes and effective work-system controls.","strain":"Is brought into difficult situations after relationships have already deteriorated.","room":"Can advise on reporting, consultation and risk controls; cannot diagnose colleagues or promise absolute confidentiality.","agency":"May escalate a credible work-design concern through an appropriate process rather than treating a friendly conversation as an adequate control."},"kira":{"name":"Kira Malik","role":"Health and safety representative","initial":"KM","value":"Consultation that changes real conditions for affected workers.","strain":"Often receives details after the informal decision has already been made.","room":"Can represent workers in health and safety consultation within statutory functions; cannot substitute for management’s duties.","agency":"May request information and consultation in the HSR role as applicable; consultation is not a substitute for implemented risk controls."},"priya":{"name":"Priya Nair","role":"Regional secondary-school arts coordinator","initial":"PN","value":"Students gaining safe, accessible, meaningful encounters with the arts.","strain":"A single excursion consumes months of planning and scarce school resources.","room":"Can share access needs and negotiate educational arrangements; cannot direct an external workforce.","agency":"May withdraw her school from a program that is financially or practically inaccessible, even when the programming is excellent."},"marli":{"name":"Marli Dwyer","role":"Independent Aboriginal creative educator","initial":"MD","value":"Long-term educational relationships, cultural authority and paid co-design.","strain":"Is invited to endorse ideas after their shape and budget are nearly decided.","room":"Can accept, refuse or set terms for her own involvement; she does not speak for all First Nations communities.","agency":"May decline endorsement or stipulate cultural governance and fair remuneration. Consultation does not obligate agreement."}};
const SCENES=[{"id":"handover","label":"1 / The house opens","when":"October 2026 · Monday, 8:43 am","title":"The room that has two futures","art":0,"cast":["mika","nadia","jules","tahlia","priya"],"story":["The theatre has reopened. Outside, the photographs show the clean lines of a new beginning. Behind one service door, two clipboards disagree about when a learning studio may be used.","A regional class has travelled three hours for a participatory sound workshop. Mika’s education run sheet lists 9 am. Nadia’s technical schedule keeps the room closed until 10:30. Tahlia notices that a requested low-sensory entry route has not reached the operational handover. Jules has been engaged for a specific call, not a morning of improvisation. The event booking says “confirmed”, a word that means something different in each department.","The first thirty students are visible beyond the glass. Someone has left a handwritten sign on the door: WELCOME. Below it is another: DO NOT ENTER."],"voice":"“I can rescue the morning. I know that is exactly why the morning keeps needing rescuing.”","closer":"Nadia is not refusing access out of spite. She is awaiting documented checks. Mika was told the room would be ready and has promised an artist demonstration. Tahlia’s part-time roster ended Friday, but three accessibility messages arrived overnight.","evidence":"The teacher can hold the group for forty minutes, but the support worker cannot extend beyond noon. There is a bookable rehearsal area across the street, but its acoustic set-up is inferior and it requires an agreed fee. A school rebooking would need a second bus approval.","question":"How do you protect access without making another invisible rescue the operating model?","choices":[{"id":"s1a","title":"Offer a smaller, correctly resourced session","desc":"Ask operations for an approved alternative room, consult the teacher and access coordinator, pay the artist for a revised call, and log the broken handover for follow-up.","limit":"Costs money and gives up some of the advertised experience.","impact":[["School","Students participate in a reduced workshop and understand what is being offered. Their teacher appreciates the choice but notices the gap between promise and delivery."],["People","Jules is paid for the change. Tahlia is relieved not to be assumed available, while Mika fears the launch looks underpowered."],["Work system","There is a named investigation of the handover. The issue is recognised, though no control has yet been verified."]],"effects":{"access":1,"capacity":1,"clarity":1,"trust":0,"ambition":-1},"signals":["Role clarity","High job demands","Change management"],"follow":"Ari requests a named handover owner and a date for testing the revised process."},{"id":"s1b","title":"Take the education into the school’s hands","desc":"Negotiate a short artist-led workshop in the school’s accessible waiting space, retain safe venue boundaries and arrange a future backstage experience.","limit":"Students get a different experience; the promised future visit creates a new obligation.","impact":[["School","The class begins making sound where they are; some students love the improvisation, others feel they missed the building itself."],["People","Mika finds the quick adaptation artistically interesting. Jules wants a written agreement before committing to the follow-up visit."],["Work system","The booking mismatch remains open. Operations and education both describe the day as a success for different reasons."]],"effects":{"access":1,"capacity":0,"clarity":-1,"trust":1,"ambition":1},"signals":["Role clarity","Recognition","Work design"],"follow":"The organisation owes the school a specific response about the promised follow-up."},{"id":"s1c","title":"Pause delivery and offer a genuine remedy","desc":"Keep the room closed, explain the access failure honestly, explore travel compensation and offer alternative dates only after operational confirmation.","limit":"A cancelled experience may be impossible for this cohort to repeat.","impact":[["School","The teacher values the truth but cannot promise a return trip; a student asks why the institution offered a booking it could not honour."],["People","Operations staff feel backed in maintaining the boundary. The education team carries disappointment, not overtime."],["Work system","The failed commitment becomes visible at senior level. Approval of remedies is still uncertain."]],"effects":{"access":-1,"capacity":1,"clarity":1,"trust":-1,"ambition":0},"signals":["Change management","Organisational justice","Role clarity"],"follow":"Ari must request authority for compensation and a reliable rebooking process."}]},{"id":"credit","label":"2 / After the applause","when":"Two weeks later · Tuesday, 6:10 pm","title":"The name that moved down the page","art":1,"cast":["mika","jules","morgan","tahlia"],"story":["A new season pitch has landed in the education team’s inbox. The words are good. Someone has turned months of conversations with artists and schools into three paragraphs that make the possibilities sound inevitable.","The cover credits a director from another portfolio. Mika’s contribution appears in the acknowledgments; Jules’s workshop concept is described as “emerging from internal collaboration.” Both have grounds to seek a different account. Neither has made a formal complaint. Mika has been shortlisted for a senior role; the pitch would be useful evidence of their leadership. Jules cannot put an abstract promise of future work into this month’s rent.","At the bottom of the email Morgan writes, “Wonderful collective effort. Please keep momentum.” Ari notices that Mika has not responded. The read receipt remains the only visible sign of contact."],"voice":"“I want to recognise the work without appointing myself judge of a history I did not witness.”","closer":"The pitch began as a collaborative meeting. One director secured a sponsor, Mika developed the core learning structure, and Jules made a distinctive artistic contribution under an agreement that does not clearly cover the new use. Tahlia supplied school-access evidence that shaped the design but is missing from the summary.","evidence":"Mika has been considering applying for a more senior role. Jules has a diary note about discussing licensing and credit; no one can yet locate a signed variation. The presentation is due in 36 hours. The person named on the cover is currently overseas.","question":"How do you address recognition while preserving procedural fairness and a viable proposal?","choices":[{"id":"s2a","title":"Negotiate interim attribution directly","desc":"Meet privately with Mika and Jules, document each contribution, and ask the sponsor to label the pitch provisional pending confirmation of authorship and rights.","limit":"The proposal goes forward with visible incompleteness, and colleagues may feel singled out.","impact":[["People","Mika feels heard but worries the intervention marks them as demanding. Jules appreciates that rights and fees are being discussed rather than folded into praise."],["Leadership","Morgan accepts a provisional slide, asking for a rapid resolution rather than a delay."],["Work system","A correction is possible, but there is not yet a shared future process."]],"effects":{"trust":1,"clarity":0,"capacity":-1,"ambition":0,"access":0},"signals":["Recognition and reward","Organisational justice"],"follow":"An interim attribution record must be checked with the contributors."},{"id":"s2b","title":"Create a clear recognition process for this launch","desc":"Publish contribution categories, invite corrections confidentially, request licensing review, and set a date after the presentation for resolving disputed accounts.","limit":"A fair procedure can feel impersonal when someone needs acknowledgment now.","impact":[["People","Tahlia adds an overlooked access contribution; Mika sees a route to fair credit but resents the deadline."],["Leadership","The executive receives a process rather than the simple celebratory message expected."],["Work system","There is a documented path for correcting attribution, subject to being applied consistently."]],"effects":{"trust":0,"clarity":1,"capacity":-1,"ambition":0,"access":0},"signals":["Organisational justice","Recognition and reward","Role clarity"],"follow":"The framework will need an owner, not just a template."},{"id":"s2c","title":"Hold a small creative authorship conversation","desc":"Invite the contributors into a facilitated working meeting, check what each seeks—credit, payment, decision rights or future leadership—and hold the external pitch until an agreed summary exists.","limit":"The sponsor may lose a time-sensitive opening; the meeting itself could expose power differences.","impact":[["People","Mika names advancement, not simply praise, as part of the problem. Jules asks for a paid role in development."],["Leadership","Morgan questions whether education can meet a commercial deadline, but receives clearer terms for a genuine collaboration."],["Work system","A joint agreement may emerge, though its feasibility depends on budget and authority."]],"effects":{"trust":1,"clarity":0,"capacity":-1,"ambition":-1,"access":0},"signals":["Low job control","Organisational justice","Recognition and reward"],"follow":"Any consensus needs a documented agreement and authorised resourcing."}]},{"id":"strategy","label":"3 / The invitation","when":"A month later · Planning day","title":"Everyone belongs, according to the slide","art":2,"cast":["morgan","priya","marli","jules","tahlia"],"story":["The new education strategy begins with a sentence nobody opposes: “Every young person belongs in this building.” The draft budget then allocates nearly everything to three high-profile city workshops.","There is no reliable travel subsidy and only limited paid artistic development. Marli, an external creative educator approached about a community-led component, has received a request to endorse the concept before a budget has been discussed. Priya explains, in polite school-email language, that the entrance ticket is rarely the main barrier. The schools that could benefit most are the least able to lend staff to a planning committee.","Morgan taps the projected slide with a pen. “We have a chance to be visible. We need a proposal by Friday.” In the darkened room, the projector makes everybody’s face look briefly agreeable."],"voice":"“People can genuinely want both visibility and access. The question is whose labour and whose chances make either one possible.”","closer":"A discretionary development envelope exists, but cannot cover every desirable improvement. Artists need paid preparation and co-design. Schools need transport, relief staffing and accessible participation. Leadership needs a credible offering and a public account of funds.","evidence":"The funds can support one of three shapes: a flagship season with paid development; a smaller co-designed outreach pilot with transport support; or three bounded school workshops with tighter costs. Each gives up something of genuine value.","question":"What programme shape will you recommend, knowing all three leave meaningful needs unmet?","choices":[{"id":"s3a","title":"A bounded school program with honest capacity","desc":"Recommend three smaller workshops with confirmed artist hours, access plans and no uncosted promises. Establish a review before expansion.","limit":"Less creative reach and weaker public visibility; some schools still cannot attend.","impact":[["Learning","The team can specify delivery conditions. Mika wonders whether the safest model will ever open a path for more ambitious work."],["Schools","Priya sees greater reliability but little structural help with travel barriers."],["Governance","Morgan asks for evidence that this is a beginning rather than a permanent ceiling."]],"effects":{"capacity":1,"clarity":1,"access":0,"ambition":-1,"trust":0},"signals":["High job demands","Low job control","Work design"],"follow":"The team needs transparent expansion criteria and a partner consultation plan."},{"id":"s3b","title":"Fund a distinctive flagship and pay its makers","desc":"Back one artistically ambitious experience, protect development fees and cultural authority, and state that access beyond the funded cohort remains a limitation.","limit":"Regional reach is narrow; a strong flagship can redirect attention from less visible programs.","impact":[["Artists","Jules and Marli can negotiate real terms for the work instead of donating expertise."],["Schools","A smaller group of students gains an exceptional experience; Priya cannot justify the travel for her cohort."],["Governance","Morgan can tell a convincing artistic story, but must own the restricted access."]],"effects":{"capacity":0,"clarity":0,"access":-1,"ambition":1,"trust":0},"signals":["Organisational justice","Recognition and reward","Access and equity"],"follow":"Access limitations and partnership terms must be visible in the sponsor report."},{"id":"s3c","title":"Move resources towards shared access","desc":"Recommend a paid co-designed pilot with fewer city sessions, a regional school partnership and transport support; ask leadership to accept lower headline numbers.","limit":"The reach may be deeper but less immediately legible to a sponsor, and co-design takes time.","impact":[["Schools","Priya can plan a real offer for her cohort; it may reach fewer students overall."],["Artists","Marli sets conditions for an ongoing paid relationship rather than symbolic endorsement."],["Governance","Morgan worries that the success metric may appear to fall even if participation becomes more equitable."]],"effects":{"capacity":-1,"clarity":0,"access":1,"ambition":1,"trust":1},"signals":["High job demands","Organisational justice","Recognition and reward"],"follow":"A funded, time-bounded co-design agreement and measures of meaningful participation are needed."}]},{"id":"meeting","label":"4 / The meeting after the meeting","when":"Thursday · 5:52 pm","title":"Three versions of the same silence","art":3,"cast":["mika","nadia","tahlia","morgan"],"story":["At a planning meeting, Nadia says the learning team has made commitments without the venue agreeing to them. Mika replies that operations is routinely consulted only to say no. Neither raises their voice. The table goes quieter anyway.","Ari asks what changed. Morgan, keen to keep the meeting moving, says, “We are all on the same side.” Afterwards, Mika waits near the stairs but leaves when Nadia approaches. Tahlia tells Ari, “I keep being asked to translate between them, and it is wearing me out.” A second producer, who was not present, has started checking every verbal agreement twice. The cost of the dispute is already travelling beyond its participants.","An hour later Ari receives two accounts of the meeting. Both sound internally coherent. In each, the other person started it."],"voice":"“The two accounts may conflict; what keeps recurring is the work they cannot authorise together.”","closer":"Nadia believes late changes create unpredictable risk and accountability. Mika believes approval routes are applied inconsistently and constrain legitimate creativity. Tahlia has repeatedly become the informal messenger. There is no established evidence of intentional sabotage, nor evidence that the recurring friction is harmless.","evidence":"A review of six recent projects shows inconsistent approval points and no reliable escalation route. Two critical emails were sent outside normal working hours. Both parties agree that decisions are being revisited; they disagree about why. Tahlia has asked to stop carrying messages.","question":"How do you intervene without forcing a false reconciliation or leaving the work system unchanged?","choices":[{"id":"s4a","title":"Redesign the decision boundary first","desc":"Map which decisions education and operations actually control, protect Tahlia from the messenger role, and use short written approvals while inviting voluntary relational repair separately.","limit":"It may feel technocratic when people want acknowledgment for perceived mistreatment.","impact":[["People","Tahlia’s messenger work is removed. Mika feels more constrained but knows when decisions must be escalated."],["Operations","Nadia finally sees a stable approval route, though it has yet to survive a busy week."],["Relationships","Some hurt remains untouched rather than being pressed into a premature apology."]],"effects":{"clarity":1,"capacity":1,"trust":0,"access":0,"ambition":-1},"signals":["Role clarity","Poor workplace relationships","Low job control"],"follow":"Consult affected workers and any HSRs on the redesigned arrangements; review how they work."},{"id":"s4b","title":"Offer an independently supported conversation","desc":"Invite both colleagues to a voluntary facilitated meeting, acknowledge actual effects without deciding intent, and agree interim operational rules before any reconciliation effort.","limit":"Facilitation needs time and trust; one participant may decline and the operational problems still need solving.","impact":[["People","Mika speaks about being disregarded; Nadia speaks about being left responsible for unmanaged change. They identify one shared concern but do not settle their history."],["Education","Ari commits not to make Tahlia the conduit for a relationship she cannot fix."],["Work system","Interim rules exist, though responsibility for formal approval is not yet settled."]],"effects":{"clarity":0,"capacity":-1,"trust":1,"access":0,"ambition":0},"signals":["Poor workplace relationships","Poor support","Role clarity"],"follow":"The forum cannot replace formal pathways where harmful conduct or health-and-safety risks are reported."},{"id":"s4c","title":"Bring in a temporary cross-portfolio decision chair","desc":"Ask Morgan to appoint a time-limited impartial chair for contested approvals, set review criteria and keep interpersonal concerns in a separate confidential route.","limit":"A third decision-maker can undermine professional autonomy and slow routine work.","impact":[["People","Nadia and Mika stop negotiating directly on every disputed item. Neither likes losing some discretion."],["Leadership","Morgan gains clearer oversight but inherits new work and must resource the chair."],["Education","Decisions are more visible, but trust does not automatically follow a new committee."]],"effects":{"clarity":1,"capacity":-1,"trust":0,"access":0,"ambition":0},"signals":["Low job control","Organisational justice","Poor workplace relationships"],"follow":"Review whether the temporary chair reduces disputes or merely relocates them."}]},{"id":"health","label":"5 / What remains after hours","when":"The following week · 7:18 pm","title":"The inbox that does not clock off","art":4,"cast":["tahlia","kira","sofia","mika","jules"],"story":["Ari closes the laptop. Then Tahlia’s message appears: “I can talk tomorrow. I cannot keep doing these hours.” She asks that a private matter not be repeated. There is no diagnosis in the email, and she has not asked Ari to make one.","The same evening a casual teaching artist declines another last-minute change. Mika writes that the team is losing the very people whose ideas it celebrates. A staffing report counts only scheduled hours. Unplanned access coordination, emotional labour and revisions have not been recorded. No one has asked for a diagnosis; what people are describing is the cumulative design of the work.","There are now several signals that the way work is organised may be creating risk. The private aspects of Tahlia’s life are not necessary to establish that question."],"voice":"“An ordinary kindness could be welcome. It does not make the hours disappear.”","closer":"Tahlia wants a manageable workload, clarity and privacy. The HSR has previously asked how unplanned hours are captured. Sofia explains that work-design hazards can be raised without sharing someone’s personal medical details; confidentiality has appropriate limits. Existing formal complaints and urgent safety matters follow separate processes.","evidence":"A sample of the last month shows recurring after-hours requests, six unrecorded program revisions and part-time roles carrying full-time contact expectations. No one yet knows the full exposure pattern across employees and contractors. A funded temporary cover arrangement would take at least a fortnight to commence.","question":"What is the next proportionate response while controls are still being developed?","choices":[{"id":"s5a","title":"Control the immediate work and begin consultation","desc":"Stop non-essential after-hours requests, triage scope, protect Tahlia’s privacy, and consult workers and HSRs on workload and work design with a resourced review owner.","limit":"Delivery commitments change before the evidence picture is complete; some colleagues worry that ambition is being withdrawn.","impact":[["People","Tahlia has a clear short-term boundary without being asked to disclose personal history. Artists receive firmer notice about changes."],["Work system","Unplanned hours are recorded, work is reprioritised and a formal risk-control process begins."],["Leadership","Morgan requests which promised outcomes will be affected and what resources are needed."]],"effects":{"capacity":1,"clarity":1,"trust":1,"access":-1,"ambition":-1},"signals":["High job demands","Poor support","Poor workplace relationships"],"follow":"Workowners and HSRs must review whether the changed work design actually controls risks."},{"id":"s5b","title":"Provide immediate cover and protect the person","desc":"Arrange voluntary time away from urgent tasks, preserve personal confidentiality, and commission independent workload mapping before changing the entire program.","limit":"A temporary cover solution can displace load onto colleagues while systemic findings take time.","impact":[["People","Tahlia is offered immediate relief on agreed terms, but Mika is anxious about the newly redistributed production work."],["Work system","An evidence-gathering process begins. Interim controls for others are only partial."],["Leadership","The short-term cost is visible and easier to approve than a larger redesign."]],"effects":{"capacity":0,"clarity":0,"trust":1,"access":0,"ambition":0},"signals":["High job demands","Poor support","Work design"],"follow":"Interim protection for other affected workers cannot depend on the mapping report arriving."},{"id":"s5c","title":"Reduce the exposed program while checking the risk","desc":"Seek approval to defer one high-demand deliverable, protect essential school commitments, and initiate worker/HSR consultation on the hazards and viable future scope.","limit":"The deferred offering may lose artists, students and sponsor confidence.","impact":[["People","The team experiences a real reduction in demand; one artist loses an anticipated opportunity and needs a fair discussion of contract effects."],["Schools","A set of bookings can be honoured, but another cohort may not get the original date."],["Governance","Leadership receives both a visible cost and a concrete proposed control."]],"effects":{"capacity":1,"clarity":1,"trust":0,"access":-1,"ambition":-1},"signals":["High job demands","Organisational justice","Change management"],"follow":"The deferral needs fair communication and a time-bound decision about what resumes."}]},{"id":"governance","label":"6 / The public account","when":"Friday · 8:05 am","title":"The report with a blank line","art":5,"cast":["morgan","priya","mika","nadia","sofia","kira"],"story":["On Friday morning a paper arrives for the next executive review. Its first page contains two photographs: a young person holding a microphone, and a foyer with no people in it. The section titled “Education impact” has a blank line where the risks and learning should go.","Morgan needs a proposal. The learning team wants a future. Operations needs decisions that can be delivered safely. Schools need arrangements they can trust. The safety adviser and HSR need a credible route from concerns to controls, with consultation and review. The consultation has begun in parts of the organisation. There is still no reliable evidence that the control measures have worked.","Ari can recommend a direction, document commitments and request resources. Ari cannot manufacture certainty. The page remains blank long enough to become a decision."],"voice":"“A report can describe what we have tried. It cannot yet certify that the risk has gone.”","closer":"The decision is not simply scale versus safety. It concerns how education’s public purpose can be pursued within actual constraints, how workers participate in decisions and how governance checks whether intended controls work.","evidence":"The executive committee can consider phased delivery, deferral or a mixed model. Resourcing and acceptance are not guaranteed. The paper must distinguish confirmed commitments from aspirations; any psychosocial risk-control plan requires employer action and consultation.","question":"Which recommendation will you take forward, and what are you unwilling to claim?","choices":[{"id":"s6a","title":"A small, accountable next season","desc":"Seek approval for a staged program with costed artist time, access requirements, transparent role boundaries and a scheduled review of work-system controls.","limit":"Some creative and geographic opportunities remain outside the initial offer.","impact":[["Education","The team receives a deliverable scope, but ambitions above it will need new approvals."],["Schools and artists","There is more reliability, less reach, and an explicit invitation to shape the next phase."],["Governance","The report states what is funded, what is merely proposed and who must review the controls."]],"effects":{"capacity":1,"clarity":1,"trust":1,"access":0,"ambition":-1},"signals":["Work design","Change management"],"follow":"A decision owner, review date, worker consultation and evidence of actual control effectiveness are still required."},{"id":"s6b","title":"A protected reset before another promise","desc":"Recommend a short, bounded program reset with existing commitments explicitly handled, workforce consultation and a revised joint operating plan before new launches.","limit":"Students and artists lose prospective openings, even if existing commitments are addressed fairly.","impact":[["Education","The next launch becomes a deliberate negotiation rather than a calendar default."],["People","Some staff experience relief; others see lost professional opportunities and ask for decision transparency."],["Governance","Morgan wants a firm point at which learning from the reset becomes a credible next offer."]],"effects":{"capacity":1,"clarity":1,"trust":0,"access":-1,"ambition":-1},"signals":["High job demands","Organisational justice","Change management"],"follow":"The reset must have explicit limits, fair arrangements and a review of whether it has controlled risks."},{"id":"s6c","title":"Two linked programs with different purposes","desc":"Recommend a small flagship with paid creative development alongside a partner-led school-access stream, each with separate authority, capacity limits and measures of success.","limit":"Coordination across two streams is more demanding and needs additional governance resources.","impact":[["Education","Creative ambition and access are both represented, but the handover between streams could reproduce old overload."],["Artists and schools","Distinct partnership terms become visible. Some still wait for a place."],["Governance","Leadership can describe plural value if it approves the necessary coordination and review capacity."]],"effects":{"capacity":-1,"clarity":1,"trust":0,"access":1,"ambition":1},"signals":["High job demands","Role clarity","Work design"],"follow":"The new structure needs paid coordination, approved budget, consulted boundaries and review of cumulative demands."}]}];
const AFTERMATH=[[{"person":"Nadia","move":"Puts the contradictory venue bookings into an operational exception register and assigns a delegate for the next school call. She does this even though the immediate session proceeds.","turn":"Jules accepts a paid revised call but states that future last-minute changes require a new fee agreement.","delay":"Two weeks later, the studio is functioning, but Finance queries the unbudgeted artist revision fee."},{"person":"Priya","move":"Sends the students’ work back as an invitation to collaborate, but keeps the proposed return visit off the school calendar until travel is funded.","turn":"Jules sends a quote for the promised second engagement. Ari cannot convert a warm promise into an unpaid commission.","delay":"A regional principal asks for a written commitment; the original improvised success now consumes unplanned coordination time."},{"person":"Priya","move":"Decides not to book another metropolitan excursion this term, whatever remedy is eventually offered.","turn":"Nadia starts a joint handover check; Tahlia asks who will resource access coordination instead of treating it as an extra task.","delay":"A complaint about the lost visit enters a correspondence register; the school’s loss is bigger than the ticket price."}],[{"person":"Mika","move":"Agrees to an interim account, then requests a formal conversation about eligibility for creative-lead roles. Credit alone will not settle their career question.","turn":"Jules asks that licensing terms be reviewed before anyone reuses the participatory design.","delay":"At the next planning meeting, a junior colleague asks whether “provisional credit” counts when promotion evidence is reviewed."},{"person":"Mika","move":"Uses the new form to document their contributions, but stops volunteering concepts in informal meetings until they see who decides the outcome.","turn":"Tahlia identifies a missing access-design contribution that was not visible in the project’s creative summary.","delay":"The process looks procedurally fair on paper; creative planning slows while people wait for the promised recognition review."},{"person":"Jules","move":"Declines to sign the revised concept note until new uses and fees are specified. The meeting cannot authorise Jules’s signature on their behalf.","turn":"Morgan asks whether the sponsor will still see the pitch this week; Mika asks who is responsible for the delay.","delay":"The postponed presentation leaves an opening for a competing proposal. Trust in the negotiation is higher than certainty about the opportunity."}],[{"person":"Priya","move":"Accepts one smaller workshop for her school but declines a second booking without travel support. A carefully bounded offer can still exclude people.","turn":"Mika proposes a more ambitious work within the same limits; the new scope would exceed the agreed preparation hours.","delay":"The next funding dashboard shows fewer students than planned, even while participating teachers report high engagement."},{"person":"Marli","move":"Negotiates a paid commission and refuses to provide a broad cultural endorsement of an initiative she did not design.","turn":"Priya explains that a flagship is not an accessible regional offer simply because it is promoted statewide.","delay":"The flagship attracts artistic attention; the unserved school cohort is no longer visible in headline participation counts."},{"person":"Marli","move":"Proposes a co-design agreement with shared approval of how the resulting work is represented; she is free to decline if its governance is diluted.","turn":"Priya can offer a committed pilot school, but needs relief staffing and transport dates before signing.","delay":"The pilot’s relationships deepen while a finance review asks whether the prolonged development phase has adequate paid hours."}],[{"person":"Nadia","move":"Agrees to trial a joint sign-off but records that unforeseen venue changes may still require immediate operational discretion.","turn":"Mika requests a route for challenging a refusal rather than accepting operations as the final creative arbiter.","delay":"Approvals become more traceable; a new dispute concerns who gets to define what counts as urgent."},{"person":"Mika","move":"Accepts the invitation to facilitation with conditions about who sees the notes; Nadia opts for separate preliminary conversations. Consent to one format cannot be assumed.","turn":"Tahlia explicitly declines to act as interpreter or note-taker for the conflict.","delay":"Each person describes the first meeting as respectful, but a subsequent deadline reveals the unaltered approval bottleneck."},{"person":"Tahlia","move":"Stops relaying disputed requests and directs colleagues to the temporary chair’s published decision route.","turn":"Nadia appreciates a definitive venue decision; Mika experiences the extra step as evidence that their expertise carries less authority.","delay":"The number of interpersonal exchanges falls; the average turnaround for disputed requests rises."}],[{"person":"Kira","move":"Asks to see the consultation plan and how controls will be checked; the HSR role does not certify the arrangement as safe.","turn":"Tahlia works the agreed hours. A different coordinator raises concerns about the work that has quietly moved to their desk.","delay":"The after-hours queue shrinks, but service requests remain unanswered; the next review needs to test exposure across the whole team."},{"person":"Tahlia","move":"Accepts time-limited cover and chooses not to discuss private circumstances. The temporary arrangement has an expiry date.","turn":"Another coordinator asks whether the additional work comes with paid hours and a right to refuse priorities.","delay":"The immediate situation improves, while the recorded team workload rises unless priorities are actively removed."},{"person":"Jules","move":"Requests written terms for the deferred engagement and declines to hold dates indefinitely without compensation.","turn":"Morgan asks for a revised delivery forecast; the education team can now examine job demands without simultaneously launching a new event.","delay":"The workload pressure eases but partnership confidence depends on prompt, fair follow-through."}],[{"person":"Morgan","move":"Requests measurable delivery conditions and a clear review date rather than a narrative assertion that the team has recovered.","turn":"Priya asks whether transport remains a barrier in the supposedly inclusive next season.","delay":"Thirty days later, the programme is smaller and clearer, but opportunities that were not funded have not stopped mattering."},{"person":"Mika","move":"Asks for a dated decision on career development rather than an indefinite promise to return to recognition once things are calmer.","turn":"Morgan approves a time-bounded review; school partners ask when the paused programme will be confirmed or released.","delay":"Some workers describe relief at the pause, while others experience insecurity from the absence of a future schedule."},{"person":"Nadia","move":"Requests a funded joint scheduling role before accepting two additional delivery streams.","turn":"Marli withholds her endorsement until the partnership includes genuine decision rights and paid time.","delay":"The dual programme sounds persuasive; an unfunded coordination role could reproduce the very work-design pressures the change set out to address."}]];

roaching a workable partnership when the education team deferred a deliverable. Both now need an answer about paid planning and whether the agreement still stands."},{"at":5,"requires":[[0,0],[4,0]],"title":"The quick rescue becomes policy","text":"The handover owner and the workload consultation both exist; the next challenge is to ensure that future visits do not depend on heroic coordination by Tahlia or another person."}];

d and trust returns can be known only through later evidence and lived consequences.","question":"What would a responsible leader refuse to claim, even if the unqualified claim would improve the presentation?"}];

ns private, as it should.','Tahlia has agreed temporary relief, but staff ask how the redistribution of work will be assessed.','A program deliverable was deferred; an artist asks for a clear account of what happens to the commission.'][a[4]]]);}return out;}
function welcome(){return `<main><div class="hero"><span class="eyebrow">Private first-reader edition · fictional arts organisation</span><h1>Behind the<br><span class="grain">Curtain.</span></h1><span class="ribbon">Plæthru 0.4 · six interlocking scenes</span><p class="intro">A theatre reopens. An education team wants to make ambitious work. People whose work depends on each other have begun to experience each other as obstacles.</p><p class="intro muted">For the moment, you are Ari Bell, the fictional Head of Education and Participation. Your choices cannot direct everyone else, settle disputed motives or make risks disappear.</p></div>${art(5)}<div class="panel tint"><strong>Before entering</strong><p>Every person, relationship, incident, motive and consequence is invented. The setting is inspired by public features of Melbourne’s performing-arts sector. This is not an Arts Centre Melbourne product, account of staff behaviour, workplace diagnosis or psychosocial risk assessment.</p><p class="micro">Approx. 25–35 minutes · Self-contained website · One screen at a time · No analytics or server submission · Optional private notes.</p></div><div class="switch"><input type="checkbox" id="savecheck" ${S.save?'checked':''} ${storageAvailable?'':'disabled'}><label for="savecheck">Save my choices and notes on this device. Leave unchecked for a private session only; avoid identifiable workplace details.</label></div><div class="btnbar"><button class="btn primary" data-action="start">Enter the first scene →</button>${S.choices.length?'<button class="btn" data-action="resume">Resume previous choices</button>':''}</div><p class="footnote">${storageAvailable?'Saving is optional. On iPhone, browser data may be cleared; exports provide a safer copy.':'Saving is unavailable in this viewing mode. Keep the page open or use Safari over an HTTPS link.'}</p><p class="footnote">The exercise explores obligations, uncertainties and human consequences. It is deliberately not a test of whether you are a good leader.</p></main>`;}

function impact(){const n=SCENES[S.step],a=n.choices[S.choices[S.step]],t=agencyTurn(S.step);return `<main><div class="scenehead"><span class="eyebrow">${esc(n.label)} / an unfolding consequence</span>${dots()}</div><h2>And then someone else acts.</h2><p class="intro">You explored <strong>${esc(a.title)}</strong>.</p><div class="panel tint"><span class="eyebrow">An independent response · ${esc(t.person)}</span><p>${esc(t.move)}</p></div><div class="readout"><strong>A second person sets a condition</strong><p>${esc(t.turn)}</p></div><div class="panel"><span class="eyebrow">A later ripple</span><p>${esc(t.delay)}</p><p class="micro">This is a specific fictional possibility conditioned on your decision, not a prediction about real colleagues.</p></div><details class="fold"><summary>See the wider education, people and system consequences</summary>${a.impact.map(([who,txt])=>`<div class="impact"><span class="eyebrow">${esc(who)}</span><p>${esc(txt)}</p></div>`).join('')}</details><details class="fold"><summary>Potential hazards and outstanding obligations</summary><p><strong>Unresolved:</strong> ${esc(a.follow)}</p><div class="pillstrip">${a.signals.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><p class="micro">These are inquiry prompts only. Assessment, consultation, suitable controls and reviews must occur in the actual work system.</p></details><div class="reflection"><label for="note">Optional private reflection: What did you not anticipate—and what evidence would alter your response?</label><textarea class="field" id="note" placeholder="Please avoid real names, medical information or identifiable cases.">${esc(S.notes[n.id]||'')}</textarea><span class="micro">These notes remain on this device/session and are not included in the shareable feedback export.</span></div><div class="btnbar"><button class="btn primary" data-action="next">${S.step===SCENES.length-1?'Review the thirty-day aftermath →':'Continue the story →'}</button><button class="btn" data-ac rong>Risk control:</strong> What was implemented, what exposure remains and what evidence will trigger review?</p><p><strong>Education:</strong> What happens for students and schools excluded by price, geography or capacity?</p><p><strong>Revisability:</strong> Which overlooked possibility deserves a real-world experiment within safe and authorised boundaries?</p></div><div class="panel tint"><strong>Ready to finish?</strong><p>You can offer feedback, return to an earlier decision, or simply close the file. No feedback is required.</p><button class="btn primary" data-action="feedback">Offer feedback →</button></div><details class="fold"><summary>Grounding and source links</summary><h3>Grounding and limits</h3><p class="micro">These characters and internal relationships are entirely fictional. The arts-education backdrop comes from public information. This exercise cannot identify, assess or manage actual psychosocial hazards, and its agential wellbeing lens is non-diagnostic.</p>${SOURCES.map(([name,url])=>`<p class="source"><a href="${esc(url)}" rel="noopener noreferrer" target="_blank">${esc(name)} ↗</a></p>`).join('')}</details></main>`;}

 if(isPrivate||S.includePath){lines.push(`FICTIONAL DECISIONS (${S.choices.length})`);S.choices.forEach((i,j)=>{const n=SCENES[j],a=n.choices[i];lines.push(`${j+1}. ${n.title}`,`Choice: ${a.title}`,`Trade-off: ${a.limit}`,`Still open: ${a.follow}`,`Autonomous fictional response: ${AFTERMATH[j][i].move}`,'');});}
 if(isPrivate){lines.push('PRIVATE REFLECTIONS — DO NOT SHARE WITHOUT REVIEW');SCENES.forEach(n=>{if(S.notes[n.id])lines.push(n.title+': '+S.notes[n.id]);});lines.push('READER FEEDBACK');}
 else{lines.push('FIRST READER FEEDBACK (no private notes)');}
 if(!isPrivate||Object.values(S.feedback).some(Boolean)){[['credible','Convincing'],['untrue','Unrealistic'],['missing','Missing voices'],['useful','Useful inquiry'],['comfort','Comfort / sharing'],['next','Next improvement']].forEach(([k,t])=>lines.push(t+': '+(S.feedback[k]||'(not answered)')));}
 lines.push('','Local export only; no file was automatically sent.','All persons and internal events in this simulation are fictional.');
 return {text:lines.join('\n'),name:isPrivate?'behind-the-curtain_PRIVATE.txt':'behind-the-curtain_first-reader-feedback.txt',private:isPrivate};
}
function fileExport(kind){
 pendingExport=exportLines(kind);
 modal(`<span class="eyebrow">Review before sharing</span><h2>${pendingExport.private?'Private session record':'Shareable feedback'}</h2><p class="micro">${pendingExport.private?'Contains your private scene notes and choices. Treat this as confidential.':'Private reflections are excluded. Your fictional decisions are included only if you selected that option.'}</p><p class="micro">On iPhone, use <strong>Share on this device</strong> to open the iOS share sheet, or select and copy the text below. A download option is provided for browsers that support it.</p><label for="exportText" class="label">Review and select your text</label><textarea id="exportText" class="field" rows="8" readonly>${esc(pendingExport.text)}</textarea><div id="exportStatus" class="status" aria-live="polite"></div><div class="stack"><button class="btn primary" data-action="share-file">Share on this device</button><button class="btn" data-action="copy-file">Select and copy text</button><button class="btn" data-action="download-file">Download .txt file</button></div><p class="footnote">No information is transmitted by Plæthru. Sharing only occurs if you choose a destination in your device’s share sheet.</p>`);
}
function exportStatus(s){const el=portal.querySelector('#exportStatus');if(el)el.textContent=s;}
function shareFile(){
 if(!pendingExport)return;
 const f=new File([pendingExport.text],pendingExport.name,{type:'text/plain'});
 const d={files:[f],title:'Behind the Curtain — first-reader feedback'};
 if(!navigator.share||!navigator.canShare||!navigator.canShare({files:[f]})){exportStatus('The system share sheet is unavailable in this viewer. Use Select and copy text or Download instead.');return;}
 try{navigator.share(d).then(()=>exportStatus('Share sheet completed. The chosen app controls delivery.')).catch(err=>{if(err&&err.name==='AbortError')exportStatus('Sharing cancelled. No file was sent by Plæthru.');else exportStatus('The share sheet could not complete. Try selecting and copying the text.');});}catch(e){exportStatus('The share sheet could not open. Try selecting and copying the text.');}
}
function copyFile(){
 const area=portal.querySelector('#exportText');if(!area)return;
 area.focus();area.select();area.setSelectionRange(0,area.value.length);
 // Older iOS viewers may not provide clipboard permission; native selection remains visible.
 try{if(document.execCommand('copy'))exportStatus('Text copied. Review the destination before pasting.');else exportStatus('Text selected. Choose Copy from the selection menu.');}
 catch(e){exportStatus('Text selected. Choose Copy from the selection menu.');}
}
function downloadFile(){
 if(!pendingExport)return;
 const b=new Blob([pendingExport.text],{type:'text/plain;charset=utf-8'});
 const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=pendingExport.name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
 exportStatus('Download requested. On iPhone, if no file appears, use Share on this device or Select and copy text.');
}
function reset(){pendingExport=null;if(!confirm('Erase this play-through and the optional saved copy on this browser?'))return;S=INITIAL();close();try{localStorage.removeItem(SAVEKEY);}catch(e){}to('welcome');}
document.addEventListener('input',setFromInput);document.addEventListener('change',setFromInput);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const x=b.dataset.action;const idx=Number(b.dataset.index);if(x==='close'){close();return;}if(x==='share-file'){shareFile();return;}if(x==='copy-file'){copyFile();return;}if(x==='download-file'){downloadFile();return;}if(x==='lens'){showLens();return;}if(x==='start'){S={...INITIAL(),save:S.save};to('scene');return;}if(x==='resume'){to(S.choices.length===SCENES.length?'report':'scene');return;}if(x==='scene'){to('scene');return;}if(x==='feedback'){to('feedback');return;}if(x==='report'){to('report');return;}if(x==='decide'){to('decide');return;}if(x==='people'){showPeople();return;}if(x==='closer'){const d=CONTRASTS[S.step];modal(`<span class="eyebrow">Look closer / multiple incomplete accounts</span><h2>What is happening, and for whom?</h2><div class="readout"><strong>What appears established</strong><p>${esc(d.seen)}</p></div><div class="readout"><strong>One reading</strong><p>${esc(d.readingA)}</p></div><div class="readout"><strong>Another reading</strong><p>${esc(d.readingB)}</p></div><div class="readout"><strong>What remains uncertain</strong><p>${esc(d.unsettled)}</p></div><div class="panel tint"><strong>An accountable question</strong><p>${esc(d.question)}</p></div>`);return;}if(x==='evidence'){modal(`<span class="eyebrow">Additional information</span><h2>What can be established?</h2><p>${esc(SCENES[S.step].evidence)}</p><p class="micro">Some information remains unknown. There is no requirement to reach certainty before acting proportionately.</p>`);return;}if(x==='choose'){if(idx<0||idx>2||!Number.isInteger(idx))return;S.choices=S.choices.slice(0,S.step);SCENES.slice(S.step).forEach(n=>delete S.notes[n.id]);S.choices[S.step]=idx;to('impact');return;}if(x==='next'){if(S.step===SCENES.length-1){S.step=SCENES.length;to('report');}else{S.step++;to('scene');}return;}if(x==='replay'){if(idx<0||idx>=SCENES.length||!Number.isInteger(idx))return;S.step=idx;S.choices=S.choices.slice(0,idx);SCENES.slice(idx).forEach(n=>delete S.notes[n.id]);to('scene');return;}if(x==='restart'){if(!confirm('Start again? This will clear your choices and reflection notes.'))return;S={...INITIAL(),save:S.save};to('scene');return;}if(x==='export'||x==='private'){fileExport(x);return;}});
document.addEventListener('keydown',e=>{if(!portal.firstElementChild)return;if(e.key==='Escape'){e.preventDefault();close();return;}if(e.key==='Tab'){const f=[...portal.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),summary')].filter(x=>x.offsetParent!==null);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('pagehide',()=>{if(S.save)save();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S.save)save();});
document.getElementById('guide').onclick=guide;document.getElementById('reset').onclick=reset;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&portal.innerHTML)close();});
render();
</script></body></html>
