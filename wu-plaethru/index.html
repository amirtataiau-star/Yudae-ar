-size:14px;font-weight:700;text-align:center}.btn:hover{filter:brightness(1.07)}.btn.light{background:var(--white);color:var(--deep)}.btn.soft{background:var(--wash);color:var(--deep);border-color:var(--line)}.btn.danger{background:transparent;border-color:#c48e84;color:var(--danger)}.btn.noborder{border-color:transparent;background:transparent;color:var(--deep)}.btn.smallbtn{padding:7px 12px;font-size:12px}.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.layout{padding:34px 0 90px}.hero{padding:28px 0 22px}.hero .lead{max-width:750px;font-size:18px;color:#455b52}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow);padding:22px}.mapcard{min-height:228px;display:flex;flex-direction:column;align-items:stretch;text-align:left;transition:transform .15s,border-color .15s}.mapcard:hover{transform:translateY(-2px);border-color:#7c9d92}.card h3{margin-bottom:6px}.mapcard .foot{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--deep)}.num{font-weight:700;font-size:12px;letter-spacing:1px;color:var(--deep)}.chip{display:inline-block;border-radius:999px;background:var(--wash);padding:3px 9px;font-size:11px;font-weight:700;color:var(--deep)}.chip.gold{background:var(--warm);color:#765732}.block{max-width:850px;margin:auto}.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}.panel-header{background:linear-gradient(118deg,#e8eee8,#f6f3e7);padding:28px 35px 25px;border-bottom:1px solid var(--line)}.panel-body{padding:29px 35px 34px}.panel-body>p{font-size:17px;line-height:1.83}.stepbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;font-size:13px}.steps{display:flex;gap:6px}.stepdot{width:24px;height:5px;border-radius:9px;background:#d9e0d9}.stepdot.o </style></head><body><header class="top"><div class="head"><div class="brand"><small>Plaethru · WU discussion preview</small>A University After the Audit</div><nav class="nav"><button data-action="map">Scenarios</button><button data-action="review">Pathway</button><button data-action="team">Team</button><button data-action="about">Guide</button></nav></div></header><main class="shell layout" id="app"></main><div id="flash" class="flash" role="status" aria-live="polite" hidden></div><footer class="shell footer">Independent fictional research prototype v1.3 · Does not determine legal compliance, student safety or institutional performance · No data transmitted</footer><script>const PACK={"version":"1.3-preview","scenarios":[{"id":"01","title":"The Offer with Conditions","tag":"Enrolment, access and the conditions attached to opportunity","month":"February","location":"Student Hub","domains":["Social and cultural inclusion","Leadership"],"intro":["The new semester begins at Riverlands University with banners across the central walkway. The welcome email says everyone belongs here. At the student hub, several staff have volunteered for extra shifts to help new students find their way. A photograph of the recent accreditation celebration still hangs beside the queue-ticket machine.","Nadia has been offered a place in a health degree. She is excited and has carefully arranged her work and family commitments. An identity-document requirement now prevents her from finalising enrolment. She has documentation, but its format does not match the online checklist. Her deadline is tomorrow. The automated email advises her to contact a service that is closed until next week.","Leo, a student-services officer, has previously helped students through similar difficulties by calling colleagues directly. The exception process works when someone knows whom to call, but no one has documented it. The admissions team is trying to treat applicants consistently; a manager is worried that informal exceptions could create new inequities.","At noon the online enrolment portal sends Nadia a reminder: incomplete enrolment may affect her place. She has already missed a paid shift to make calls. Nobody has set out to exclude her. The situation nonetheless depends on rules, relationships and limited capacity that different people cannot see in the same way.","Leo slides the checklist across the desk, then turns it over. On the reverse is a handwritten extension number that half the office uses and no public webpage mentions. “I can call,” he tells Nadia, “but I cannot promise the person who answers will still be there tomorrow.” Nadia looks at the roster on her phone. Another shift is already marked in red."],"turn":"Three weeks later, the semester has started. Nadia has attended some classes, but the temporary resolution to her enrolment problem has consequences for access to assessment and support. A new staff member is asked to process a similar request. What is understood as an exceptional case may be becoming a recurring feature of the system.","people":["Nadia — commencing student: working and caring responsibilities; wants to participate without being asked to repeatedly recount private history.","Leo — Student Hub officer: trusted by students, knowledgeable about workarounds, already taking extra shifts.","Priya — admissions manager: accountable for equitable processes, security and deadlines, with limited authority over central IT."],"roles":[{"id":"student","name":"Nadia · commencing student","position":"Student","known":"You know which documents you have, your own deadlines and what repeated requests cost you. You do not know whether the system has other routes.","limit":"You may request advice, assistance or review. You cannot change enrolment policies yourself.","documents":[{"title":"The email","body":"“Your acceptance is conditional on completing verification by 5 pm tomorrow.” The message does not explain an alternative document pathway."},{"title":"Who can help?","body":"One student adviser has offered a callback; it is not clear whether they can alter the system status."}],"choices":[{"title":"Ask for a named review","why":"Request a written explanation, named contact and a way to preserve the offer while the documents are checked.","then":"An adviser opens a time-limited review. Nadia has a contact but cannot yet assume enrolment is complete.","open":"A later assessment deadline remains uncertain.","signal":"A named-review pathway may improve navigation while creating time-sensitive follow-up work."},{"title":"Seek independent advocacy","why":"Ask the student union for support before sending more personal information.","then":"The advocate explains options and helps frame a request. This takes additional time but reduces Nadia’s isolation.","open":"The formal deadline has not moved.","signal":"Support demand moves partly to student advocacy; deadlines still require attention."},{"title":"Request a temporary enrolment arrangement","why":"Ask whether conditional access to learning can be maintained during verification.","then":"A provisional arrangement is considered, subject to authorised checks. Nadia can begin orientation activities.","open":"A temporary workaround may fail later unless the underlying process is resolved.","signal":"Temporary access can create later assessment and data-system dependencies."}],"followups":[{"title":"Seek an update in writing","then":"Nadia obtains a clearer record of what has and has not been authorised.","open":"The timetable implications still require follow-up."},{"title":"Ask who can resolve the underlying barrier","then":"A question about recurring processes enters the next institutional conversation.","open":"Nadia cannot be required to carry the redesign herself."}]},{"id":"officer","name":"Leo · Student Hub officer","position":"Professional staff","known":"You can see queue patterns and have handled several similar cases. You can contact admissions but cannot override verification requirements.","limit":"You may provide correct information, escalate and document recurrent barriers; you cannot bypass required safeguards.","documents":[{"title":"Queue note","body":"Four students have queried non-standard document formats this week; only one has lodged a formal review."},{"title":"Workaround","body":"A named colleague has occasionally unlocked a manual review; there is no accessible public procedure."}],"choices":[{"title":"Arrange a supported escalation","why":"Contact the authorised review team, document the barrier and provide a named point of contact.","then":"The student receives a clearer route. Leo’s team must now absorb additional coordination.","open":"The manual pathway remains dependent on personnel.","signal":"Extra coordination becomes visible as staff-capacity demand."},{"title":"Document and escalate the pattern","why":"Record de-identified instances and request a review of the public instructions.","then":"The manager now sees more than a single exception, but Nadia’s immediate deadline still requires individual attention.","open":"System redesign is not yet funded.","signal":"Institutional evidence improves while urgent individual support remains open."},{"title":"Seek specialist guidance before advice","why":"Check document requirements with admissions and privacy staff before giving assurances.","then":"Leo avoids overpromising. The callback takes longer, increasing uncertainty for Nadia.","open":"The service needs a timely interim communication plan.","signal":"Careful verification can still impose time costs on students."}],"followups":[{"title":"Request paid coordination time","then":"Leo’s manager receives a specific request to resource repeat cases.","open":"Whether those hours are approved remains open."},{"title":"Make the process visible to colleagues","then":"A provisional guidance note reduces dependence on a single knowledgeable officer.","open":"It must be checked by the policy owner."}]},{"id":"manager","name":"Priya · admissions manager","position":"Institutional manager","known":"You know policy requirements, complaint escalations and the pressures on the portal team. You cannot know Nadia’s full situation without appropriate consent.","limit":"You may authorise a review, change staff guidance within delegation and commission process work, not waive mandatory verification.","documents":[{"title":"Monthly data","body":"“Enrolment exceptions resolved: 96%.” The measure does not show duration or student costs."},{"title":"Resourcing","body":"The system vendor change window is six weeks away. A supported manual queue is immediately possible, but would need staff time."}],"choices":[{"title":"Create a documented interim pathway","why":"Authorise a time-bound review queue with a named escalation owner and transparent criteria.","then":"Some applicants gain a reliable route rather than a personal favour. Staff workload and timeliness need oversight.","open":"The underlying portal remains unchanged.","signal":"Documented access improves but creates a resourcing obligation."},{"title":"Commission a barrier audit","why":"Review exceptions, deadlines and accessibility with affected students and staff.","then":"A wider pattern may be identified; immediate cases still need safe interim handling.","open":"The audit has no automatic authority to change IT priorities.","signal":"More inclusive evidence may expose unresolved design and authority gaps."},{"title":"Prioritise portal clarification","why":"Update public-facing information and instruct advisers to use consistent interim wording.","then":"Confusion may fall, but clearer instructions do not themselves make an inaccessible process workable.","open":"Exception handling remains a separate responsibility.","signal":"Clearer guidance can increase requests to already constrained services."}],"followups":[{"title":"Place the issue on the operations agenda","then":"An accountable owner is named for follow-through.","open":"An agenda item is not proof of system change."},{"title":"Seek feedback on the interim route","then":"Affected applicants can identify whether the path works in practice.","open":"Consultation should not require them to repeatedly disclose personal histories."}]},{"id":"academic","name":"Elise · first-year academic adviser","position":"Academic staff","known":"You have evidence of students attending classes while enrolment details remain pending. You cannot view private admissions records.","limit":"You can arrange suitable learning access within policy and refer an unresolved admissions issue to responsible officers.","documents":[{"title":"Class list","body":"Some students appear in class but are missing from assessment systems."},{"title":"Faculty note","body":"Staff do not know what conditional access means for submission deadlines."}],"choices":[{"title":"Clarify approved participation conditions","why":"Seek a verified account of who can engage in classes and assessments pending administrative resolution.","then":"The immediate teaching implications become clearer.","open":"Admission authority remains elsewhere.","signal":"Teaching and enrolment systems need coordinated information."},{"title":"Protect accessible learning materials","why":"Provide a supported route to available materials while eligibility is formally checked.","then":"A student may avoid unnecessary learning loss if authorised.","open":"Formal access cannot be assumed.","signal":"Teaching continuity requires a legitimate interim arrangement."},{"title":"Escalate the recurring gap to the course committee","why":"Document de-identified pattern concerns and a deadline for response.","then":"The faculty has a concrete issue to take up.","open":"Student cases still need individual attention.","signal":"Administrative access becomes visible in academic quality work."}],"followups":[{"title":"Check the assessment access in practice","then":"A faculty check can reveal whether interim arrangements worked.","open":"The admissions decision remains separate."},{"title":"Request a cross-unit escalation owner","then":"The gap receives a named responsible contact.","open":"Ownership without time may fail."}]}],"connections":["04","05","07","08","09","10"],"counterfactuals":[["Provide two weeks of paid review capacity","Short-term follow-up becomes more feasible, but systemic redesign remains open."],["Give students a clear interim eligibility statement","Students have more usable information, though individual eligibility still requires authorised verification."]],"question":"What has the process assumed about the people required to use it?","threads":["Admission access","Temporary arrangements","Support workload"],"auditExtension":{"beats":["At the Friday enrolment desk, Nadia watches the queue end before the deadline has moved. Leo has a note describing the obstacle, but no authorised interim confirmation. When Nadia asks whether she can attend orientation, he can offer a phone number, not an answer. Nadia misses an afternoon shift to try again.","Nadia receives a named interim contact and is allowed into the orientation session while eligibility is checked through the correct route. She has not yet been cleared for the assessment system. Leo places a date beside the pending verification: without a real handover, the success at the front desk could unravel four weeks later.","The admissions team notices that several students have been sent between the same two offices. Priya approves a documented short-term escalation channel within existing authority. Nadia can plan the next week, although the permanent process requires an access review and a decision outside the team's control."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"officer","text":"Leo writes down the failed enrolment pathway and asks the Student Hub supervisor who owns the next callback; his request has no power to change the policy."},{"role":"manager","text":"Priya asks admissions staff to locate the documented exception procedure before the next intake deadline."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?"},{"id":"02","title":"The Room That Was Booked","tag":"Space allocation, access and whose use counts","month":"March","location":"South Campus Shared Spaces","domains":["Places and spaces","Social and cultural inclusion"],"intro":["The South Campus student commons is being renovated. A small multipurpose room beside the courtyard has long been used for prayer, respite, sensory regulation and informal meetings. Official bookings describe it simply as “flexible space.” The university has recently promoted its inclusive campus and is pleased that a new public welcome event has attracted interest.","Mei, a wheelchair user who travels between campuses, relies on a direct accessible route through the room’s adjoining corridor. Omar, another student, uses the space at predictable times for quiet reflection. They arrive to find a sign saying the room has been booked for a week of orientation events. A temporary route around the building is difficult to follow, and a security desk is closed at the times several students need access.","Rosa, a campus-services officer, sees multiple calendars, inconsistent records of use and requests from different departments. The facilities director Ava is attempting to accommodate a contractor timetable and promised events within fixed resources. A recent consultation found broad support for a more welcoming commons, but some people who rely on the space had not been able to participate.","A booking can appear routine in one system and be a decisive condition of access in another person’s day. Who has authority to change the arrangement, whose use is recorded, and how will the university recognise obligations that cannot be resolved simply by majority preference?","Outside the room, a cleaner has left a trolley beside the taped-off corridor. A student who uses a mobility aid has stopped attending the evening gathering; the replacement route adds another fifteen minutes after her last class. The events officer knows the temporary booking can be moved. They have already printed hundreds of invitations listing the old location."],"turn":"Ten days later, the welcome events have ended, but the temporary closure has been extended for equipment storage. A student reports that the alternate access route is unavailable after 5 pm. The university is considering permanent room changes in the same building.","people":["Mei — student: has practical knowledge of access routes, timing and fatigue.","Rosa — campus-services officer: manages the spaces people use each day.","Ava — facilities director: holds approval authority within project and budget constraints."],"roles":[{"id":"student","name":"Mei · student","position":"Student","known":"You know which routes and facilities are usable for you. You do not know all construction constraints or other users’ access needs.","limit":"You can provide feedback, request access arrangements and participate if you choose. You cannot speak for all disabled students.","documents":[{"title":"Plan detail","body":"The proposed lift is accessible; the route to it includes a steep service ramp during works."},{"title":"Consultation","body":"The accessible plan was posted as an image without a readable text alternative."}],"choices":[{"title":"Request an accessible walk-through","why":"Ask to inspect routes and identify specific barriers with an accountable project contact.","then":"The problem becomes tangible and documented.","open":"A visit is not equivalent to a design commitment.","signal":"Access feedback may require redesign time and accountable decisions."},{"title":"Seek an interim route in writing","why":"Ask for a usable, tested route and contingency during works.","then":"A provisional arrangement is considered using actual travel needs.","open":"Long-term redesign still matters.","signal":"Temporary arrangements depend on operational support and clear communication."},{"title":"Coordinate feedback without becoming a proxy","why":"Invite varied users to contribute through accessible routes, while declining to represent everyone.","then":"The consultation has a chance to reach different affected people.","open":"Participation takes time and needs proper support.","signal":"Consultation quality becomes visible alongside representativeness limits."}],"followups":[{"title":"Check the route in ordinary use","then":"A real-world access test may reveal problems missed on plans.","open":"The university remains responsible for safe access."},{"title":"Request a design decision record","then":"The reasons for accepting or refusing alternatives become reviewable.","open":"Transparency does not guarantee agreement."}]},{"id":"officer","name":"Rosa · campus-services officer","position":"Professional staff","known":"You know daily room use, mobility patterns, maintenance and unofficial workarounds. You do not control the contractor’s design.","limit":"You can document operational problems, arrange safe interim measures within authority and escalate design risks.","documents":[{"title":"Use diary","body":"The quiet room has more uses than the booking system records."},{"title":"Works memo","body":"The service corridor is described as an accessible alternative without evidence of a user test."}],"choices":[{"title":"Test temporary access with users","why":"Arrange an accessible operational check and provide the project team with observed barriers.","then":"A route problem is documented before opening.","open":"Project changes may require director approval.","signal":"Design assumptions become challengeable with site-based evidence."},{"title":"Protect a functioning quiet-space alternative","why":"Find a safe interim allocation and specify access and hours.","then":"Some existing use is sustained during refurbishment.","open":"Space remains scarce and shared agreements may be contested.","signal":"Short-term accommodation requires operational staffing."},{"title":"Escalate conflicting building uses","why":"Provide a clear record of the competing uses and unresolved access risks.","then":"Decision-makers receive a more accurate account of trade-offs.","open":"The deadline still forces prioritisation.","signal":"Governance inherits an explicit unresolved space commitment."}],"followups":[{"title":"Review conditions after opening","then":"Staff gather evidence on how access operates in use.","open":"Post-opening review cannot excuse preventable access failures."},{"title":"Share a tested route map","then":"Staff and students get a more reliable navigation aid.","open":"Maps need updating as works change."}]},{"id":"manager","name":"Ava · facilities director","position":"Institutional manager","known":"You have budget, contractor and compliance information and can commission design review. You cannot presume that survey popularity settles access obligations.","limit":"You must ensure applicable access and safety requirements are addressed. You can adjust scope and authorise consultation and procurement within delegation.","documents":[{"title":"Program constraint","body":"Revising one structural element may shift the contractor handover date."},{"title":"Consultation report","body":"“80% of respondents support the commons.” The survey did not ask about all affected uses."}],"choices":[{"title":"Pause sign-off for an access review","why":"Require tested accessible routes and decision records before relevant approval.","then":"The project gains a more defensible basis at some cost to timing.","open":"Not every spatial conflict is resolved.","signal":"Accessible implementation becomes an explicit budget and timing obligation."},{"title":"Redesign with affected users and staff","why":"Fund targeted paid participation and record what can and cannot be changed.","then":"The project receives more situated evidence and transparent decisions.","open":"Some choices may still disappoint stakeholders.","signal":"Consultation carries reciprocity and operational resource requirements."},{"title":"Stage the refurbishment with protections","why":"Sequence construction while preserving safe temporary access and essential quiet-space functions.","then":"Immediate disruption can be reduced by a carefully monitored interim plan.","open":"Later-phase work must not quietly disappear.","signal":"A future capital commitment enters institutional memory."}],"followups":[{"title":"Publish the trade-off rationale","then":"Affected people can see what was decided and what remains open.","open":"Accountability requires follow-up, not just disclosure."},{"title":"Fund a post-occupancy access check","then":"The university can evaluate actual use after opening.","open":"Any known safety or access issue needs immediate attention."}]},{"id":"studentrep","name":"Omar · student representative","position":"Student representative","known":"You know the shared room’s everyday community uses and the limits of the official booking system.","limit":"You can convey concerns and request proper access decisions; you cannot claim to speak for all users.","documents":[{"title":"Use diary","body":"Different groups use the space for quiet reflection at times not recorded as bookings."},{"title":"Event notice","body":"The events are widely advertised but the alternate quiet room is not."}],"choices":[{"title":"Seek a protected interim quiet space","why":"Ask for a usable alternative with clear hours and an accountable contact.","then":"Some essential use can continue if a suitable space is provided.","open":"Alternatives require verification, not assumptions.","signal":"Interim space obligations become part of event planning."},{"title":"Request an open booking rationale","why":"Ask who set priorities and whether affected users were included before the allocation.","then":"Decision rights become discussable.","open":"A review does not ensure immediate access.","signal":"Consultation evidence may need correction."},{"title":"Gather bounded feedback from users","why":"Invite voluntary accounts of actual use without requiring disclosure of personal faith or health information.","then":"Previously invisible use may become apparent.","open":"Collection must be safe and appropriately supported.","signal":"Evidence improves but does not decide rights."}],"followups":[{"title":"Check if the alternative is actually usable","then":"A practical test can identify new constraints.","open":"Users do not carry facilities obligations."},{"title":"Seek review of booking priorities","then":"A repeatable allocation question reaches responsible staff.","open":"Final decisions require legitimate authority."}]}],"connections":["01","04","06","07","10"],"counterfactuals":[["Fund accessible consultation and operational trials","More affected uses become visible, but project constraints persist."],["Extend the contractor decision window","Additional design options can be considered; the delay has budget and user impacts."]],"question":"Who was imagined when the shared space was designed?","threads":["Spatial accessibility","Decision rights","Temporary provision"],"auditExtension":{"beats":["The room-booking notice remains on the accessible entrance after students have assembled. The class moves into a different room, but two students learn about the relocation only when they arrive. A facilities officer has fixed the calendar without checking what actually happened on the floor.","A temporary room change protects access to this class. It also displaces a scheduled community activity, whose organisers were not asked before the shift. At the next meeting, the question is less about which group deserves the room than why some changes reach the people affected and others do not.","Campus staff trial a booking safeguard and a named on-site check. A student arrives early to test the route and finds that signage still leads to the wrong entrance. The problem is now visible and attributable, but the next booking cycle will reveal whether the safeguard holds."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"studentrep","text":"The student representative gathers access concerns from several event attendees and refuses to treat silence as approval."},{"role":"officer","text":"The events officer asks facilities to verify that the temporary route is usable during evening sessions."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?"},{"id":"03","title":"The Incident That Wasn’t Filed","tag":"Reporting, racial safety and the meaning of evidence","month":"April","location":"Student Support Centre","domains":["Social and cultural inclusion","Leadership"],"intro":["The student-services team has finished a series of workshops on accessible reporting and respectful campus culture. A plaque recognising Riverlands University’s recent accreditation hangs beside reception. Several staff are proud of improvements and have worked for years to achieve them.","Salma, a student in a large professional degree, has begun avoiding one tutorial. On multiple occasions, she has heard comments about who “really belongs” in the profession. She cannot know how others interpreted every remark, but the cumulative effect on her willingness to attend is clear to her. She has asked for a private conversation with Mari, a student-support practitioner.","Salma does not presently want to lodge a formal complaint. She worries that a report could identify her in a small tutorial group. Mari knows there are related informal concerns, although these may involve different people and circumstances. The new complaints information is easier to find online than before, but the response team has reduced staffing this month.","The university retains its applicable responsibilities to prevent and respond to racism, provide appropriate safeguards and maintain effective processes. No participant is being asked to choose whether those duties exist. The question is how people with different knowledge, authority and constraints might respond appropriately without making promises they cannot keep.","At the teaching building, Salma reads a reply that begins, “Thank you for your courage.” The rest is a list of webpages. She had not described herself as courageous. She had asked whether she could still attend Tuesday’s class without being seated beside the person who made the remark. Mari is trying to find someone who can answer that question without asking Salma to repeat the whole account."],"turn":"Two weeks pass. The number of formal reports is still low, but use of informal advice channels has increased. The faculty asks whether the low formal count indicates that its work is succeeding. Mari has an unanswered follow-up request, and Salma is considering whether to attend her next practical class.","people":["Salma — student: wants meaningful safety and options without being required to surrender privacy.","Mari — support practitioner: explains options and safety pathways within a stretched service.","Helen — governance lead: responsible for access, oversight and escalation, not for deciding individual allegations."],"roles":[{"id":"student","name":"Salma · student","position":"Student","known":"You know your experiences and concerns. You do not know what is in other reports or what the institution can lawfully disclose.","limit":"You control what you choose to share, subject to clear explanations of confidentiality limits. You cannot determine findings or other people’s accounts.","documents":[{"title":"Process summary","body":"Support, independent advice and formal options are described. The extent of confidentiality depends on the circumstances."},{"title":"Class timetable","body":"Your next practical group includes some of the same people; there is a possible transfer, but spaces are limited."}],"choices":[{"title":"Explore supported reporting options","why":"Ask for a clear account of routes, confidentiality limits and possible interim learning arrangements.","then":"Salma receives information to make an informed choice. No complaint outcome is assumed.","open":"The practical-class conditions require attention now.","signal":"Requests for informed access can increase support demand without increasing formal case counts."},{"title":"Seek independent advice first","why":"Contact an independent service and decide later whether to engage the university process.","then":"Salma gains space to consider options outside an immediate institutional pathway.","open":"The university still needs to address foreseeable risks appropriately.","signal":"Low report numbers may conceal unmet needs and independent help-seeking."},{"title":"Request a supported learning adjustment","why":"Ask what learning arrangements are possible while concerns are considered, without requiring a predetermined case outcome.","then":"An authorised interim option is explored. A timetable solution is not the same as a safety resolution.","open":"The fairness and effectiveness of arrangements need review.","signal":"Practical adjustments can create teaching and workload dependencies."}],"followups":[{"title":"Ask what has changed since the conversation","then":"Salma receives an update within appropriate confidentiality boundaries.","open":"An update is not proof that wider conditions are now safe."},{"title":"Continue with independent support","then":"Her own support pathway remains available without forcing a formal complaint.","open":"The institution still has its separate responsibilities."}],"dossier":{"seeks":"Staying in class without losing control of her account","underPressure":"Repeated disclosure, retaliation concerns, loss of access","liveQuestion":"Which parts of your account, if any, can be shared, and with whom?"}},{"id":"practitioner","name":"Mari · support practitioner","position":"Professional staff","known":"You have Salma’s account and know relevant options. You have seen other informal enquiries but cannot combine them as proof of any allegation.","limit":"You can assess immediate needs, explain limits and options, refer appropriately and seek governed specialist advice.","documents":[{"title":"Service demand","body":"Appointments increased this month; two colleagues are covering vacancies."},{"title":"Reporting guide","body":"The public guide has improved. The staff process for coordinating informal pattern concerns is less clear."}],"choices":[{"title":"Provide support and a bounded referral","why":"Explain support, confidentiality limits, safety options and an appropriate specialist contact.","then":"Salma has a supported route; Mari’s service absorbs follow-up work.","open":"The student decides what to pursue and when, within applicable safeguards.","signal":"Careful response adds coordination needs for staff already carrying high load."},{"title":"Seek governed advice about recurring concerns","why":"Consult the authorised safeguarding and complaints team on appropriate pattern inquiry without disclosing beyond necessity.","then":"The university can examine procedural questions without treating informal concerns as established allegations.","open":"Resourcing and privacy decisions remain.","signal":"Informal signals enter governance inquiry, requiring specialist time and care."},{"title":"Arrange a warm, consent-aware handover","why":"With appropriate permission, connect Salma with a named specialist and document limits to information-sharing.","then":"Continuity improves while reliance on named staff becomes visible.","open":"A handover can fail if staff capacity changes.","signal":"Continuity depends on sustained paid capacity rather than goodwill alone."}],"followups":[{"title":"Request follow-up cover from the team lead","then":"The service formally records additional demand and its potential effect on access.","open":"Funding and staffing decisions remain elsewhere."},{"title":"Check Salma’s preferred contact channel","then":"Follow-up becomes more responsive to student preferences.","open":"Confidentiality limits remain applicable."}],"dossier":{"seeks":"Maintaining a usable, consent-aware support route","underPressure":"Unfunded follow-up and mistaken assumptions about findings","liveQuestion":"Who owns the next contact, and does that person have capacity?"}},{"id":"manager","name":"Helen · governance lead","position":"Governance","known":"You see complaints-system reports, staffing allocations and policy duties. You do not possess the whole story of each student’s experience.","limit":"You can commission review, clarify ownership and propose resources. You cannot infer safety from case counts.","documents":[{"title":"Dashboard","body":"Formal complaints have fallen compared with last semester. The dashboard does not include people who did not report."},{"title":"Policy work","body":"A process review is scheduled, but capacity for implementation has not been agreed."}],"choices":[{"title":"Resource access and follow-up","why":"Assign paid support capacity for accessible pathways and arrange an independent review of process performance.","then":"The pathway is more likely to function while the review proceeds.","open":"Safety outcomes remain unproven; continuing funds require decision.","signal":"Reporting accessibility gains a more credible staff-capacity foundation."},{"title":"Review what is missing from the data","why":"Commission ethical mixed evidence: access experiences, process timeliness and appropriate confidential qualitative input.","then":"The institution gains a more nuanced picture of what it does not yet know.","open":"The review must have safe participation and clear limits.","signal":"Institutional evidence expands beyond the formal complaint count."},{"title":"Clarify ownership of responses","why":"Name escalation and follow-up responsibilities and improve guidance for all staff.","then":"Confusion may reduce, though clarified guidance can increase the volume of requests.","open":"Implementation requires operational time.","signal":"Clearer process can increase demand before capacity improves."}],"followups":[{"title":"Ask for a resourcing decision date","then":"Responsibility for implementation is made more visible.","open":"A decision date cannot itself guarantee outcomes."},{"title":"Invite safe feedback on process accessibility","then":"A governed channel is proposed for information about user experience.","open":"Students must not be pressured into disclosure."}],"dossier":{"seeks":"A defensible prevention and response process","underPressure":"Treating low complaints as low harm or informal reports as proven cases","liveQuestion":"Which evidence and safeguards are needed for a system review?"}},{"id":"teacher","name":"Imogen · teaching staff member","position":"Teaching staff","known":"You know a student has changed tutorial attendance and have seen an indirect concern. You do not know private support or case records.","limit":"You can maintain appropriate teaching and safety responses and ask qualified teams for guidance, not investigate allegations yourself.","documents":[{"title":"Attendance","body":"One student has missed sessions without giving details."},{"title":"Guidance","body":"The teaching guide identifies support and referral routes, not authority to determine complaint findings."}],"choices":[{"title":"Seek advice on safe teaching arrangements","why":"Request bounded guidance on foreseeable learning risks and appropriate support.","then":"Teaching steps can be considered without revealing confidential student information.","open":"The service must communicate within permissions.","signal":"Racial safety response connects to teaching capacity."},{"title":"Offer all students clear support pathways","why":"Provide accurate contacts and appropriate classroom expectations without singling anyone out.","then":"Support information becomes available to the cohort.","open":"Awareness alone cannot establish safety.","signal":"Teaching support may receive more contacts."},{"title":"Report observed classroom conditions","why":"Record only what you personally know and follow the institutional process.","then":"Governance gets a bounded factual account.","open":"That account is not an allegation finding.","signal":"Evidence quality depends on responsible scope."}],"followups":[{"title":"Review participation conditions","then":"The teacher can check whether learning access remains workable.","open":"Confidential processes stay separate."},{"title":"Ask for paid support planning time","then":"The teaching team has a resource question.","open":"A request is not allocation."}],"dossier":{"seeks":"Students can keep learning safely","underPressure":"Confidentiality breaches or a purely symbolic class announcement","liveQuestion":"What teaching adjustments are within your actual authority?"}}],"connections":["04","05","08","10"],"counterfactuals":[["Allocate specialist support time","A follow-up arrangement becomes feasible without assuming an investigation outcome."],["Provide accessible confidential advice routes","People can understand options earlier; confidentiality must be explained accurately."]],"question":"What does the institution know about people who did not file a complaint?","threads":["Racial safety","Reporting confidence","Support capacity"],"auditExtension":{"beats":["Two weeks pass. An administrator circulates the low number of formal complaints as evidence that the faculty is safer. Salma still avoids the tutorial. Mari has recorded an unmet request for follow-up and knows that informal enquiries have increased; those enquiries cannot be treated as findings about any particular allegation.","Mari makes a consent-aware referral and arranges an agreed contact route. Salma receives a useful explanation of options, but the specialist appointment is a week away. In a parallel meeting, Helen sees a quarterly report with a blank column for access delays. The referral happened; timely access remains unsettled.","Helen commissions a review of process accessibility without presuming that informal enquiries establish allegations. The review team asks Mari for de-identified timing information and students for voluntary input. Salma is offered a practical learning arrangement; she is free to decline involvement in the review."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"practitioner","text":"Mari checks which contact channels Salma has consented to use and logs an access-delay issue separately from any allegation."},{"role":"manager","text":"Helen requests that the quarterly briefing distinguish complaints received, advice sought and outcomes actually determined."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?","workConditions":{"possibleHazard":"High emotional demands and variable role clarity for employees receiving sensitive disclosures","potentiallyAffectedWorkers":"Mari, Imogen and colleagues managing student-support or teaching responsibilities","designCheck":"Check confidential supervision, available time and resourced response routes; student rights remain distinct.","note":"Fictional authoring check, not a risk assessment or determination of compliance."}},{"id":"04","title":"The Invisible Work","tag":"Employment, care and the limits of goodwill","month":"May","location":"Faculty Offices","domains":["Leadership","Teaching, learning and research"],"intro":["The campus has a reputation for approachable teaching staff. Students speak warmly about people who go beyond their formal duties to help. One of those people is Imogen, a sessional tutor whose teaching contract ends at the conclusion of the semester.","Imogen has become a trusted point of contact for students navigating enrolment problems, unsettling classroom interactions and difficulties finding the right university services. Many contacts begin with an ordinary question and become more complicated. Imogen believes that students deserve reliable help. She has also counted six unpaid hours spent coordinating support in a fortnight.","A faculty newsletter nominates Imogen for an inclusion award. Meanwhile, the academic manager Elena is preparing a staffing plan under a reduced discretionary budget. She has seen student feedback praising Imogen but has not seen the informal support work needed to produce it. Salma, who relies on contact with Imogen, has been told the tutor may not be teaching next term.","The faculty’s inclusion commitments are sincere. The unresolved question is how those commitments are distributed across paid work, relationships, temporary employment, specialist expertise and actual institutional authority.","Imogen opens the spreadsheet where she tracks the hours she cannot submit through the teaching allocation system. Six entries sit beneath the heading “student follow-up.” She has been nominated for an award. At the same time, she is drafting a message that begins, “My contract ends on Friday.” Salma, who does not know the contract date, has written, “Is it still okay to ask you?”"],"turn":"A month later, Imogen’s contract is ending. A new tutor will teach the unit, but no one has received a clear handover plan. Students have been encouraged to seek help through the central service, whose appointment calendar is filling quickly. An award nomination is about to be announced.","people":["Salma — student: values a trusted contact and fears having to repeat sensitive information.","Imogen — sessional tutor: cares about continuity and is approaching a contract boundary.","Elena — academic manager: can reallocate some hours, but not assume unlimited funds."],"roles":[{"id":"student","name":"Salma · student","position":"Student","known":"You know which support relationships have worked for you. You do not know the employment arrangements behind them.","limit":"You can request an appropriate handover or independent help. You cannot require a particular teacher to remain available.","documents":[{"title":"Contact details","body":"Imogen’s university account may close shortly after results are finalised."},{"title":"Central service","body":"The current appointment wait is longer than the student guide suggests."}],"choices":[{"title":"Request a named handover","why":"Ask what continuity arrangements are available, with control over what personal information is shared.","then":"A possible contact and consent-aware plan are discussed.","open":"The new contact’s actual capacity is not yet known.","signal":"Continuity becomes a resourcing question for student services and teaching."},{"title":"Maintain direct tutor contact for now","why":"Ask Imogen whether a short closing conversation is possible within her available role and hours.","then":"A trusted conversation can occur if feasible and appropriate.","open":"The ongoing support dependency remains.","signal":"Reliance on a temporary employment relationship becomes more visible."},{"title":"Seek independent service navigation","why":"Ask advocacy or student support to clarify available pathways.","then":"More than one potential route is identified.","open":"The central service still needs to be accessible in practice.","signal":"Navigation pressure moves to support services and student advocacy."}],"followups":[{"title":"Check the handover actually works","then":"A practical access check identifies any remaining gap.","open":"It is not the student’s duty to fix staffing."},{"title":"Document an access barrier if willing","then":"A de-identified issue can inform service planning.","open":"Disclosure remains optional."}],"dossier":{"seeks":"A reliable support contact without repeating everything","underPressure":"Dependency on a contract that is ending","liveQuestion":"Who answers after Friday?"}},{"id":"teacher","name":"Imogen · sessional tutor","position":"Teaching staff","known":"You know the support work you have undertaken and the risks of an abrupt handover. You do not know whether future funding exists.","limit":"You can use appropriate referral routes, keep information confidential, set boundaries and submit a workload account.","documents":[{"title":"Timesheet","body":"Paid hours include teaching and marking; informal student-support coordination is not itemised."},{"title":"Award email","body":"“We are thrilled to recognise your extraordinary commitment to students.” The nomination includes no work allocation."}],"choices":[{"title":"Prepare a bounded handover and log time","why":"Offer consent-aware referral, document workload and request paid transition time.","then":"Students have a clearer route, and the faculty receives evidence of hidden work.","open":"The manager must decide whether to resource continuity.","signal":"Reporting-system access depends in part on continuity and paid follow-up."},{"title":"Provide a time-limited bridge","why":"Offer one final appointment within permissible hours while seeking a formal handover.","then":"The immediate relationship is supported, but long-term dependence on the tutor is not viable.","open":"Coverage after contract end remains unresolved.","signal":"Short-term support competes with remaining teaching workload."},{"title":"Escalate the employment condition","why":"Bring the repeated support tasks to the coordinator and seek advice about role boundaries and paid duties.","then":"The structural issue becomes discussable rather than privately absorbed.","open":"Students still need appropriate near-term support.","signal":"Care labour is made visible within budget and governance conversations."}],"followups":[{"title":"Ask for an accountable transition owner","then":"Responsibility is transferred to a role with continuing institutional authority.","open":"A named owner still requires adequate time."},{"title":"Protect a clean contract ending","then":"Imogen sets an appropriate boundary and provides available referral information.","open":"A boundary cannot substitute for the university’s duty to provide support."}],"dossier":{"seeks":"An ethical end to the contract with students supported","underPressure":"Unpaid duties and promising care she cannot sustain","liveQuestion":"Which work is funded, and who receives the handover?"}},{"id":"manager","name":"Elena · academic manager","position":"Academic manager","known":"You see staffing plans, student praise and budget limits. Hidden relationship work rarely appears in workload reports.","limit":"You may authorise time within delegated funds, design a handover and escalate sustained resource needs.","documents":[{"title":"Budget note","body":"The faculty has six weeks of limited discretionary teaching-support funds."},{"title":"Risk item","body":"A draft risk register mentions “key person dependency” but has no assigned owner."}],"choices":[{"title":"Allocate paid transition support","why":"Provide specified paid time for handover and a named continuing support owner.","then":"Continuity improves within an explicit short-term allocation.","open":"Ongoing arrangements need funding review.","signal":"A service response elsewhere gains more credible support capacity."},{"title":"Introduce a triage and referral arrangement","why":"Clarify which work belongs to teaching, specialist support and academic management.","then":"Requests can reach appropriate roles more reliably if training and staffing exist.","open":"Triage can create new queues rather than eliminate work.","signal":"Institutional process becomes clearer and its capacity limits more measurable."},{"title":"Record and escalate the recurrent labour","why":"Commission a workload account and seek a faculty-level decision on inclusion responsibilities.","then":"Unseen labour enters decision-making, though immediate staff availability remains constrained.","open":"A study does not fund follow-up.","signal":"Budget deliberations inherit a concrete unresolved commitment."}],"followups":[{"title":"Set a date to review the handover","then":"The faculty can learn whether continuity survived contract turnover.","open":"A review date is not evidence of successful care."},{"title":"Invite sessional staff to redesign within paid hours","then":"Staff experience can inform a practicable process.","open":"Participation must itself be resourced."}],"dossier":{"seeks":"Teaching continuity within actual delegation","underPressure":"An impressive paper plan with nobody available to implement it","liveQuestion":"Which hours are authorised, and how will delivery be checked?"}},{"id":"support","name":"Mari · student support team lead","position":"Professional services","known":"You know referral queues, staffing limits and handover vulnerabilities. You cannot renew teaching contracts.","limit":"You can manage within the service, document demand and request additional resources.","documents":[{"title":"Appointment queue","body":"Wait times fluctuate, and handovers are not tracked consistently."},{"title":"Escalation note","body":"A rise in referrals coincides with tutor contract turnover."}],"choices":[{"title":"Arrange a bounded named handover route","why":"Set clear service ownership for time-sensitive requests.","then":"Continuity is more plausible within current staffing.","open":"The queue remains constrained.","signal":"Service load becomes more visible in institutional planning."},{"title":"Report capacity limits transparently","why":"Provide a monitored account of demand, wait times and missed handovers.","then":"Decision-makers can see where informal care was compensating for a gap.","open":"Data does not create staff hours.","signal":"Hidden work enters governance evidence."},{"title":"Seek temporary paid cover","why":"Request a specific short-term allocation and review date.","then":"The proposed response is costable.","open":"Approval and longer-term design remain open.","signal":"Support capacity becomes a budget dependency."}],"followups":[{"title":"Check that referrals reach someone","then":"Handover quality becomes observable.","open":"An appointment cannot alone establish successful support."},{"title":"Request a sustained staffing decision","then":"The service submits a concrete future resource question.","open":"It needs executive authority."}],"dossier":{"seeks":"A workable intake route that does not bury colleagues","underPressure":"A larger queue disguised as a completed handover","liveQuestion":"How does a student test whether the route works?"}}],"connections":["01","03","05","07","08","10"],"counterfactuals":[["Provide paid support and handover time","Continuity is more plausible; the university still needs specialist and longer-term capacity."],["Create a named contact whose position continues next term","Dependence on a single casual employee diminishes; the receiving team needs real availability."]],"question":"When does recognition hide the work that makes inclusion possible?","threads":["Paid care labour","Continuity","Resource ownership"],"auditExtension":{"beats":["On the last Monday of semester, Imogen sends the handover note she can legitimately share and closes her university laptop. Salma's message is still waiting in a central queue. The award nomination mentions Imogen's extraordinary care; the timetable does not contain time for anyone to take over the work.","Elena authorises a limited number of paid transition hours. Imogen can prepare a handover within her contract, but Mari's team is already managing a queue. Salma receives two different contact names. The money has created a possible bridge; it has not yet established a usable route.","Imogen is paid for a consent-aware handover, Mari identifies an ongoing service owner, and Elena schedules a check after the contract ends. Salma tests the route and receives a reply from the named person. A longer-term staffing decision remains open, but the handover is observable rather than ceremonial."],"events":{"student":["Salma asks that her support history be transferred only with her agreement. The service confirms what can be shared, yet still has to identify who will answer after the contract ends.","Imogen can offer a closing conversation inside existing paid hours. She is careful not to promise access after her contract ends; Salma still needs a reliable institutional contact.","An independent adviser gives Salma a route that does not rely on Imogen. Finding it costs another appointment and repeats part of the story she has already told."],"teacher":["Imogen writes a consent-aware handover note and submits the six recorded hours for review. Recording the work creates evidence, not retrospective authorisation for any unpaid time.","Imogen offers one bounded closing appointment during permitted hours. The final conversation helps, but a temporary bridge cannot cover future student enquiries.","Imogen raises the employment issue formally. Elena now has a documented resource question; the reporting route cannot itself extend the contract or settle any entitlement."],"manager":["Elena authorises four paid transition hours within her delegation and nominates a continuing service owner for approval. The appointment and verification still have to happen.","Elena creates a referral map showing which team owns which request. The map is useful only if Mari has capacity to receive what the teaching team redirects.","Elena sends a workload account to faculty management with a requested decision date. The six hours are visible; the resource decision is still pending."],"support":["Mari assigns a named worker to urgent handovers, but declines to describe the service as fully staffed. She checks that the named worker actually has appointments available.","Mari logs a queue increase and gives the faculty two missed-handover examples with identities removed. The count helps planning but does not provide students with immediate access.","Mari requests time-limited paid cover and a review date. The request is acknowledged, but no additional appointment exists until approval is granted."]},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"teacher","text":"Imogen notifies the team of her contract end-date and offers information she can appropriately hand over within authorised work."},{"role":"manager","text":"Elena checks the faculty delegation and asks who can authorise the transition hours, without assuming unpaid cover."},{"role":"support","text":"Mari checks the queue and warns against calling an unstaffed mailbox a completed handover."},{"role":"student","text":"Salma asks where future questions should go; her enquiry is not evidence of a completed transfer."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?","workConditions":{"possibleHazard":"High job demands, limited job control and service pressure transferred through referrals","potentiallyAffectedWorkers":"Imogen, Mari and the support team","designCheck":"Check paid work, workload design, staff consultation, resourcing and whether a referral is actually usable.","note":"Fictional authoring check, not a risk assessment or determination of compliance."}},{"id":"05","title":"The Case Study in Week Four","tag":"Curriculum, contested narratives and conditions for inquiry","month":"May","location":"Learning Studio 3","domains":["Teaching, learning and research","Social and cultural inclusion"],"intro":["It is week four of a professional studies unit. Imogen, a sessional tutor, is about to facilitate a case study about public policy, migration and the responsibilities of institutions. The course materials contain a provocative account from a local controversy. The case was chosen to stimulate critical inquiry; the students who are expected to discuss it bring very different histories to the room.","During discussion, one student describes some migrant communities as less willing to integrate. Farah challenges the claim and asks which evidence supports it. The original speaker says their opinion is being silenced. A few classmates become quiet while others ask for more debate. Time runs out before anyone examines the source closely.","After class, Farah tells Imogen the exercise left her feeling exposed, although she also values difficult inquiry. Another student appreciates that contentious questions were permitted. Imogen is unsure how to address the different responses while supporting learning and safety. The course coordinator Daniel has inherited a unit taught by several short-contract tutors who rarely meet together.","The university values academic freedom, critical learning and culturally safe participation. The question is how the case was chosen, how claims are investigated, what responsibilities teaching staff carry, and which structural conditions make well-supported facilitation possible.","A student folds the case-study handout into quarters. The lecturer has called it a useful opportunity to hear different opinions; the student remembers the room falling silent after one remark, then the tutor asking everyone to move on. A second student wants to study the issue more closely. The tutor has eight minutes before the next class and still needs to mark the reflective posts."],"turn":"In week five, two students request tutorial changes. The course has received mixed feedback, and a new case study is scheduled. Tutors say the unit needs a consistent account of evidence, dialogue and available student support.","people":["Farah — student: values debate and wants claims examined without having her identity become the lesson.","Imogen — sessional tutor: committed to inquiry, carrying preparation across multiple campuses.","Daniel — course coordinator: accountable for assessment, coherent teaching support and fair processes."],"roles":[{"id":"student","name":"Farah · student","position":"Student","known":"You heard the exchange and know how it affected your learning. You have incomplete information about what Imogen intended or what the course team has discussed.","limit":"You can request support, information and teaching adjustments. You cannot decide the disciplinary position of another student.","documents":[{"title":"Unit guide","body":"The learning outcomes include examining evidence, professional ethics and differing interpretations."},{"title":"Group message","body":"Several peers want a further discussion; others prefer to avoid the topic."}],"choices":[{"title":"Ask for a learning-focused follow-up","why":"Request a discussion of evidence standards and participation agreements in the next tutorial.","then":"Imogen receives a specific request rather than a general demand to stop difficult conversation.","open":"The class still needs an approach to conflict and safety.","signal":"Teaching expectations and support needs become more explicit."},{"title":"Seek a private conversation and support","why":"Meet with a trusted course contact and explain which conditions prevented participation.","then":"The concern is heard without compelling disclosure to classmates.","open":"Whether subsequent teaching changes is not assured.","signal":"Private support creates a need for careful teaching-team coordination."},{"title":"Submit feedback through the unit","why":"Provide a written account with boundaries on how it may be shared.","then":"The course receives an account that can inform review.","open":"Delayed action may affect the next class.","signal":"Formal feedback can improve evidence but may not deliver immediate classroom change."}],"followups":[{"title":"Check what changed in the next class","then":"Farah can assess whether participation arrangements have altered.","open":"A single improved session does not establish durable safety."},{"title":"Ask about appeal or support routes","then":"Information about learning and support routes becomes clearer.","open":"The student retains control over personal disclosure."}]},{"id":"teacher","name":"Imogen · sessional tutor","position":"Teaching staff","known":"You know what you heard, what you intended and how the timing unfolded. You do not know all students’ experiences or confidential support needs.","limit":"You can facilitate learning, record what occurred, seek guidance and adapt teaching within curriculum and policy.","documents":[{"title":"Preparation","body":"There is no paid team meeting this week. The coordinator has offered a 15-minute call."},{"title":"Teaching materials","body":"One reading uses a provocative headline; its evidence base has not been examined closely in class."}],"choices":[{"title":"Re-open through evidence and norms","why":"Plan a bounded discussion of the claims, sources and participation agreements, with a check-in and referral options.","then":"Inquiry continues with clearer expectations and safeguards.","open":"Effective facilitation requires preparation and support.","signal":"Pedagogical repair has a workload implication."},{"title":"Meet affected students privately","why":"Offer confidential pathways to talk and clarify available institutional supports without asking students to educate the class.","then":"Students gain routes to be heard; coordination with the course team is needed.","open":"The next shared learning experience remains to be designed.","signal":"Individual support needs careful continuity across teaching staff."},{"title":"Consult the course team first","why":"Document the event and seek teaching and equity advice before setting the next activity.","then":"Imogen avoids acting beyond her remit; students need a timely account of what happens next.","open":"The teaching-team response may be delayed.","signal":"Specialist guidance creates a real time and coordination requirement."}],"followups":[{"title":"Request paid preparation and collegial support","then":"A concrete workload request accompanies the teaching plan.","open":"Approval remains a management decision."},{"title":"Invite evaluation of the learning conditions","then":"Students can comment on whether future inquiry is workable.","open":"Feedback should not substitute for resolving harm and obligations."}]},{"id":"manager","name":"Daniel · course coordinator","position":"Academic lead","known":"You can view unit-level patterns and workload allocations. Individual student experiences reach you through limited and often conflicting accounts.","limit":"You can organise teaching-team guidance, adjust learning activities and seek institutional advice, not decide unrelated complaint findings.","documents":[{"title":"Tutorial spread","body":"Six tutorials use the same assessment but different facilitators and readings."},{"title":"Staffing","body":"Some tutors have two hours of paid preparation per week and no scheduled team meeting."}],"choices":[{"title":"Resource a teaching-team response","why":"Hold a paid discussion of case-based facilitation, evidence and referral pathways.","then":"Tutors gain shared support, though a single meeting cannot ensure equivalent practice.","open":"Additional paid hours must come from a real allocation.","signal":"Teaching coherence improves only if staff time is sustained."},{"title":"Review curriculum materials with students","why":"Invite an appropriate review of readings, assessment and class processes without turning students into compulsory advisers.","then":"The unit’s assumptions become discussable.","open":"The next class still requires a near-term plan.","signal":"Curriculum evidence deepens with an obligation to close the feedback loop."},{"title":"Clarify support and escalation routes","why":"Issue guidance about existing pathways and make space for tutors to seek confidential advice.","then":"Staff and students have clearer information; implementation needs monitoring.","open":"A guidance email alone will not resolve classroom dynamics.","signal":"Improved process visibility may increase demand for support."}],"followups":[{"title":"Observe a subsequent tutorial with consent","then":"The team gains contextual information about actual practice.","open":"Observation requires a safe purpose and clear boundaries."},{"title":"Check sessional staff capacity","then":"Additional needs are documented in the staffing conversation.","open":"Recognition is not yet additional paid time."}]},{"id":"designer","name":"Pavel · learning designer","position":"Academic support staff","known":"You have access to the case-study rationale and teaching resources but limited access to classroom accounts.","limit":"You can review design features and support staff; you do not decide allegations or students’ perspectives.","documents":[{"title":"Case study","body":"The source uses an inflammatory headline and an incomplete evidence citation."},{"title":"Unit brief","body":"Critical inquiry is expected, but scaffolding for contested claims is sparse."}],"choices":[{"title":"Redesign the evidence activity","why":"Propose a source-comparison task and clearer norms with the teaching team.","then":"Students may examine claims more carefully.","open":"Facilitation conditions still matter.","signal":"Pedagogical quality becomes a resourced design issue."},{"title":"Offer paid tutor preparation materials","why":"Seek resources and time for staff to rehearse facilitation choices.","then":"Implementation becomes more feasible for casual teachers.","open":"Shared resources are not guaranteed to work in each room.","signal":"Staffing and curriculum design become linked."},{"title":"Request student review of learning conditions","why":"Offer voluntary, supported input on the case-study framing.","then":"The learning design receives situated challenge.","open":"Students should not be compelled to educate others.","signal":"Consultation becomes a teaching-design obligation."}],"followups":[{"title":"Test the revised activity","then":"The team can assess whether the changes altered participation.","open":"A class observation cannot prove every student’s safety."},{"title":"Keep an open revision point","then":"The design remains revisable as new evidence emerges.","open":"Ownership and time are still needed."}]}],"connections":["03","04","08","10"],"counterfactuals":[["Add paid time for teaching-team preparation","Staff can prepare shared approaches without uncompensated effort; pedagogical uncertainty remains."],["Offer a carefully facilitated learning dialogue","Some voices may become more audible, but participation must remain voluntary and safe."]],"question":"What makes difficult inquiry possible, and for whom?","threads":["Learning conditions","Sessional preparation","Classroom voice"],"auditExtension":{"beats":["The case-study seminar ends without a clear account of what happened in the room. One student stops speaking; another argues that an uncomfortable question was shut down. The tutor's teaching notes record that 'discussion occurred', offering little insight into who could participate or how the learning continued.","The teaching team reviews the actual case materials and offers an alternative route into discussion. Students disagree about the intervention. The coordinator has evidence of the teaching decision, but the next tutorial will show whether it supported inquiry as well as safety.","Students are offered a bounded opportunity to revisit the case through distinct sources and documented learning aims. The coordinator receives anonymous, optional feedback. Several students report that having a clear account of the task mattered more than agreeing with its conclusion."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"student","text":"One student asks for an opportunity to discuss the case-study experience privately, without representing the entire class."},{"role":"designer","text":"The learning designer identifies a possible re-engagement activity but does not add uncompensated work to the tutor’s week."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?"},{"id":"06","title":"The Consultation After the Decision","tag":"Institutional consultation, cultural authority and predetermined decisions","month":"July","location":"Council Chamber","domains":["Leadership","Teaching, learning and research","Places and spaces"],"intro":["Riverlands University has announced an ambitious campus place-making project. A draft proposal includes Indigenous language signage, artwork and a renewed curriculum commitment to Country. Senior staff describe it as a visible expression of the university’s welcoming culture.","The project team has met with several First Nations people. Their contributions have been careful and significant, but the minutes describe all of the meetings as “consultation completed”. Kira, an Aboriginal university project adviser, asks whether the project has actually established the appropriate relationships with relevant Traditional Owners and whose authority will guide decisions about knowledge, Country and representation.","The proposal is due for approval next week. A communications contractor has already prepared a launch plan. The executive sponsor wants to honour existing relationships while meeting an institutional timetable. The records show no agreed process for permissions, decision rights or the use of contributed cultural knowledge.","The question is not whether participants can vote on First Nations authority. That authority is not created by this exercise. This scenario instead examines what university staff and decision-makers can responsibly do when an attractive institutional project has moved faster than the relationships and permissions that should guide it.","The launch invitation is already in the vice-chancellor’s diary. A staff member asks whether Traditional Owners have approved the wording on the building wall. The project folder contains a record of a consultation meeting, but no decision authorising the wording or its use. A procurement deadline is approaching. The university team can pause its own work; it cannot invent authority that has not been given."],"turn":"The launch date approaches. The contractor asks for final signage and approval to reproduce cultural material in a public campaign. A project adviser identifies a decision-rights question that cannot be resolved by a generic survey or executive enthusiasm.","people":["Kira — Aboriginal university adviser: raises questions about institutional process, permissions and appropriate authority; her position is represented through authored accounts, not participant role-play.","Noah — project coordinator: can document and escalate missing approvals.","Leah — dean: oversees curriculum changes and institutional relationships.","Vivienne — executive sponsor: controls institutional project approvals within proper governance."],"roles":[{"id":"coordinator","name":"Noah · project coordinator","position":"Professional staff","known":"You have meeting records and the production timeline. You do not determine Traditional Owner authority or permission to use cultural knowledge.","limit":"You can identify missing approvals, stop unauthorised use within your delegation and escalate the issue.","documents":[{"title":"Minute excerpt","body":"“Community consultation: complete.” The record does not specify cultural permissions or decision rights."},{"title":"Contractor request","body":"The creative agency requests a final asset package by Friday."}],"choices":[{"title":"Escalate the missing authority pathway","why":"Request a pause on cultural content approvals pending appropriate engagement and permissions.","then":"A specific governance gap becomes visible.","open":"The project deadline must be revisited; consent cannot be assumed.","signal":"Institutional memory now contains an unresolved authority obligation."},{"title":"Audit what was actually agreed","why":"Prepare a restricted, factual map of meetings, intended uses, permissions and unanswered questions.","then":"The university gains a clearer account of its own process.","open":"A process record does not confer cultural authority.","signal":"Consultation claims become more accountable and potentially less flattering."},{"title":"Seek specialist guidance and notify contractors","why":"Contact authorised First Nations governance leads and instruct the supplier not to use unapproved content.","then":"The immediate risk of unauthorised reproduction may be reduced.","open":"The wider project still needs properly constituted decision-making.","signal":"Timelines and contracts inherit a cultural-governance condition."}],"followups":[{"title":"Correct the consultation status","then":"The project record no longer claims more authority than was established.","open":"A corrected document is only a starting point."},{"title":"Request a decision-rights map","then":"Responsible staff can identify who must approve specific activities.","open":"The relevant authorities must determine that map."}]},{"id":"dean","name":"Leah · dean","position":"Academic leader","known":"You know curriculum goals and previous university commitments. You have been briefed through summary reports.","limit":"You may alter university curriculum plans and organise appropriately resourced relationships; you cannot independently grant cultural permission.","documents":[{"title":"Curriculum plan","body":"A new unit includes local knowledge examples that have not yet been reviewed with the relevant knowledge holders."},{"title":"Staff note","body":"Academic staff are unsure who to approach and whether engagement time is recognised."}],"choices":[{"title":"Pause the affected curriculum component","why":"Withhold unapproved local materials while establishing the correct authority and review arrangements.","then":"The course retains other learning activities while specific content is responsibly reconsidered.","open":"An adequate curriculum redesign takes time and paid work.","signal":"Teaching decisions inherit an explicit authority and resource question."},{"title":"Fund an appropriate co-design process","why":"Seek a relationship-led process under the guidance of relevant First Nations authorities, with paid participation.","then":"Decision-making conditions may improve if the invitation is accepted.","open":"The university cannot determine partners’ willingness or timelines.","signal":"Community engagement and institutional resource commitments become linked."},{"title":"Review authority across the faculty","why":"Require units using cultural knowledge to identify permissions and governance arrangements.","then":"An internal pattern may become visible before further materials are used.","open":"A review needs specialist leadership and practical implementation.","signal":"Evidence and governance begin to capture previously invisible assumptions."}],"followups":[{"title":"Protect time for authorised review","then":"An institutional workload decision supports responsible curriculum work.","open":"Paid hours do not purchase cultural authority."},{"title":"Revisit the academic deadline","then":"The faculty can establish a viable timetable aligned with actual relationships.","open":"No timetable can compel participation."}]},{"id":"executive","name":"Vivienne · executive sponsor","position":"Executive leadership","known":"You control sign-off and strategic communication. You know a launch has been promised, but cultural decision rights are inadequately established.","limit":"You can pause university approvals, revise contracts and fund legitimate processes; you cannot claim Traditional Owner consent.","documents":[{"title":"Approval pack","body":"“Consultation co
