mpleted” appears in the executive summary without detailed permission records."},{"title":"Launch plan","body":"A major public event is booked, but the event format can be revised."}],"choices":[{"title":"Pause approval pending proper authority","why":"Defer cultural content sign-off and commission the appropriate governance pathway.","then":"The public timetable changes while relationships and permissions receive priority.","open":"This may require contract and budget changes.","signal":"Institutional accountability inherits a visible, unresolved commitment."},{"title":"Rescope the public launch honestly","why":"Discuss achievements that are ready without using unapproved cultural representations, and explain the ongoing work carefully.","then":"The event can occur without overstating the partnership.","open":"Rescoping does not complete the underlying commitments.","signal":"Institutional evidence becomes more precise and less celebratory."},{"title":"Create an accountable First Nations governance pathway","why":"Support the relevant authorities and university structures to determine appropriate decision rights and resources.","then":"Potential for better processes emerges without predetermining their form or outcome.","open":"Authority cannot be manufactured by an internal vote.","signal":"Governance and resourcing remain linked to future projects."}],"followups":[{"title":"Review what the university can legitimately claim","then":"Public communications can distinguish aspiration from approved practice.","open":"The institution must still follow through."},{"title":"Allocate resources for long-term relationships","then":"Future engagement can be supported materially.","open":"Partnership terms remain determined with relevant authorities."}]},{"id":"procurement","name":"Marta · contracts and communications lead","position":"Professional staff","known":"You know deadlines, supplier terms and asset approval flows. You do not determine cultural authority.","limit":"You can hold contractor use of unapproved material, correct inaccurate statements and escalate costs.","documents":[{"title":"Draft contract","body":"An image license request refers generally to “community content” without named permissions."},{"title":"Launch schedule","body":"Publication is booked, but content can be replaced with general campus material."}],"choices":[{"title":"Hold unapproved cultural assets","why":"Require evidence of appropriate permission before relevant material is used.","then":"Immediate unauthorised use may be prevented.","open":"The project still needs legitimate cultural governance.","signal":"Contract timing becomes subordinate to authority checks."},{"title":"Correct public claims of completed consultation","why":"Amend communications to accurately describe work still underway.","then":"An overstated claim can be withdrawn.","open":"Correction is not the same as completed engagement.","signal":"Institutional reporting gains an unresolved obligation."},{"title":"Price a compliant rescope","why":"Develop a revised delivery option for authorised decision-makers.","then":"A concrete trade-off reaches governance.","open":"Cultural decisions remain with relevant authorities.","signal":"Budget flexibility affects whether proper process can occur."}],"followups":[{"title":"Keep an approvals ledger","then":"The institution can trace what it is allowed to publish.","open":"Documentation does not create consent."},{"title":"Review future supplier briefs","then":"Later contracts can include appropriate decision points.","open":"Authority must still be determined case by case."}]}],"connections":["02","08","09","10"],"counterfactuals":[["Allow proper time for relationship and authority processes","Institutional urgency reduces, though cultural permissions remain undecided."],["Resource appropriate First Nations-led review","Review has better material conditions, but must be governed by relevant authorities."]],"question":"Who has authority here, and which parts of that authority lie outside the university?","threads":["Cultural authority","Institutional claims","Long-term relations"],"auditExtension":{"beats":["The university's project team prints a consultation summary, then learns that the relevant cultural authority did not authorise the proposed use. An event deadline is approaching. The correct next step may involve stopping work already paid for; the timetable cannot create authority that was never granted.","The project is paused while the university checks who can speak for which decisions. Some team members worry about reputational costs. The pause prevents further unauthorised commitments, but it is not permission to ask First Nations people to resolve the university's rushed planning for free.","A governance pathway is proposed with appropriately resourced engagement, clear decision rights and an option to decline. The university withdraws claims it cannot substantiate. Whether the work proceeds remains with the relevant authorities and authorised processes, not with the participant's simulation choice."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"coordinator","text":"The project coordinator checks whether the required cultural authorisation exists in writing before proceeding."},{"role":"procurement","text":"The procurement officer explains what changes if the signage contract is paused; contractual costs do not substitute for cultural authority."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?","workConditions":{"possibleHazard":"Conflicting deadlines, low control and repeated consultation demands for project employees","potentiallyAffectedWorkers":"Noah, Marta and project/faculty staff","designCheck":"Check authority and approval gates, workload planning, and paid time; First Nations authority remains separate and non-negotiable.","note":"Fictional authoring check, not a risk assessment or determination of compliance."}},{"id":"07","title":"The Adjustment That Never Arrived","tag":"Reasonable adjustments, implementation and distributed responsibility","month":"August","location":"Assessment and Accessibility Centre","domains":["Teaching, learning and research","Social and cultural inclusion","Leadership"],"intro":["During orientation, Harper disclosed an access need and met with the university’s accessibility service. A plan was agreed for alternative assessment arrangements and accessible learning materials. Harper left the meeting relieved. A confirmation email said relevant teaching staff would receive the approved arrangements before classes began.","Four weeks later, a laboratory assessment is approaching. The unit’s timetable shows a room that does not support the planned adjustment, and the approved alternative format has not reached the tutor. Harper has contacted three teams and received three assurances that the matter is being handled. None can say who is responsible for the final step.","Jess, an accessibility coordinator, can see an approved plan but not the faculty’s assessment system. Sessional demonstrator Arun wants to make the lab workable but has no authority to unilaterally change requirements. Course director Dalia has an email showing a successful upload. The case management system says “completed.”","All involved want the approved arrangement to work. The difficulty lies between approval, communication, implementation and checking whether the student can actually participate. The university’s applicable access responsibilities remain in force; participants explore how to discharge them appropriately.","Harper has read the adjustment plan twice. The plan itself is clear. The room booking is not. At reception, the attendant says the accessible room was allocated to another class and suggests that a chair might be carried upstairs. Harper does not want another improvised arrangement. Jess, the coordinator, has received confirmation from two separate teams that the request is “being handled.”"],"turn":"The assessment day arrives. A temporary alternative is offered, but Harper is concerned about whether it is equivalent and about the time already lost. Jess receives another request involving the same system handoff. Dalia must decide what evidence of implementation should reach the next quality meeting.","people":["Harper — student: understands their access needs and the cost of repeated explanations; controls unnecessary disclosure.","Jess — accessibility coordinator: knows the approved plan but does not control every teaching system.","Dalia — course director: responsible for adequate assessment arrangements and timely implementation."],"roles":[{"id":"student","name":"Harper · student","position":"Student","known":"You know the approved arrangement, missed communications and effects on your participation. You cannot see the systems that failed to transfer it.","limit":"You can request urgent implementation and review, while choosing what you share beyond what is necessary.","documents":[{"title":"Approved plan","body":"An authorised adjustment is recorded with a dated confirmation."},{"title":"Assessment timetable","body":"The scheduled laboratory arrangement does not visibly reflect the plan."}],"choices":[{"title":"Request an accountable implementation check","why":"Ask who will confirm the arrangement in the actual teaching environment before assessment.","then":"A named check is requested rather than another general assurance.","open":"The test must happen in time to matter.","signal":"An approved plan exposes a missing operational handover."},{"title":"Seek an urgent alternative with equivalent access","why":"Request an appropriately authorised, accessible option while the existing arrangement is resolved.","then":"A contingency is considered to reduce immediate loss of participation.","open":"Equivalence and fairness need review, not assumption.","signal":"Temporary access creates a real teaching and coordination obligation."},{"title":"Seek independent support and review","why":"Ask for assistance to understand relevant review and access pathways.","then":"Harper gains another contact and a clearer question to put to the university.","open":"Another referral may still leave implementation unresolved.","signal":"Support routes are only valuable if they reach an accountable implementer."}],"followups":[{"title":"Check how the arrangement worked in practice","then":"A difference between approval and delivery can be documented.","open":"A student should not need to repeatedly prove the same barrier."},{"title":"Ask about future prevention","then":"The university receives a clear question about repeat cases.","open":"Investigation remains institutional work."}],"dossier":{"seeks":"To complete the assessment on an equal basis","underPressure":"Missed assessment and being asked to accept a makeshift solution","liveQuestion":"Has the arrangement been implemented and checked with you?"}},{"id":"coordinator","name":"Jess · accessibility coordinator","position":"Professional staff","known":"You can see the authorised adjustment and coordination record. You cannot assume the faculty has implemented it from a system status.","limit":"You can pursue authorised disclosure, escalate the implementation risk and request verification.","documents":[{"title":"System log","body":"“Plan delivered to faculty queue.” This does not show that a specific tutor received or understood it."},{"title":"Case pattern","body":"Several recent cases were closed without documented teaching-side confirmation."}],"choices":[{"title":"Establish a verified handover","why":"Contact the accountable course team, confirm the adjustment in practice and log responsibility.","then":"The gap between digital delivery and real implementation becomes visible.","open":"Verification requires staff time and consent-aware information-sharing.","signal":"Unfunded coordination demand emerges from approved adjustments."},{"title":"Escalate systemic failure with an urgent individual response","why":"Address Harper’s immediate assessment and report recurring handoff concerns through appropriate governance.","then":"Individual access and structural inquiry proceed in parallel.","open":"System repair will outlast one assessment.","signal":"Quality assurance inherits an implementation-not-approval question."},{"title":"Seek a controlled interim solution","why":"Work with authorised teaching staff to establish a temporary arrangement and check its adequacy.","then":"An immediate pathway is considered without pretending the original plan worked.","open":"The university remains responsible for durable implementation.","signal":"Temporary accommodations increase a need for clear resourcing."}],"followups":[{"title":"Close the case only after checking access","then":"The record can distinguish action requested from implemented.","open":"Case closure is still not proof of equitable experience."},{"title":"Request an auditable transfer standard","then":"The service proposes a testable handover requirement.","open":"It needs actual systems and staffing support."}],"dossier":{"seeks":"A real handover between access and teaching teams","underPressure":"Approval existing only in email","liveQuestion":"Who verifies the room, format and teaching contact?"}},{"id":"director","name":"Dalia · course director","position":"Academic leader","known":"You know assessment outcomes, teaching assignments and a report that the adjustment was uploaded. You do not know which handoff failed.","limit":"You can make authorised assessment arrangements, clarify faculty ownership and escalate system changes.","documents":[{"title":"Unit file","body":"An email indicates the plan was sent; the tutor’s teaching brief has no relevant note."},{"title":"Roster","body":"Sessional staff changed shortly before the assessment and the handover was abbreviated."}],"choices":[{"title":"Arrange and check equivalent access now","why":"Authorise an appropriate immediate response and independently verify it with the responsible teams.","then":"Assessment access may become feasible while the handoff is investigated.","open":"The lost time and wider system risk remain.","signal":"Supported teaching arrangements need coordination and paid preparation."},{"title":"Audit faculty implementation rather than approval counts","why":"Map where approved adjustments fail to reach the people delivering assessment.","then":"A recurrent weakness can become governable rather than exceptional.","open":"The current assessment cannot await a full audit.","signal":"Evidence quality shifts from paper approval to actual delivery."},{"title":"Fund clear teaching-side ownership","why":"Propose paid handover time and a named accountable assessment contact.","then":"Staff can act within a more workable process if resourced.","open":"Funding decisions and training remain.","signal":"Continuity and adjustment capacity become linked commitments."}],"followups":[{"title":"Check Harper’s actual participation","then":"The course can determine whether its immediate response functioned.","open":"The student should control unnecessary disclosure."},{"title":"Review the next assessment cycle","then":"A repeat check can expose whether the repair held.","open":"One successful test is not a complete institutional solution."}],"dossier":{"seeks":"An accountable, timely institutional response","underPressure":"Funding a review while today’s access remains unresolved","liveQuestion":"Which necessary decision is within your delegation now?"}},{"id":"tutor","name":"Arun · laboratory demonstrator","position":"Sessional teaching staff","known":"You can see the teaching room and assessment tasks. You received no adjustment handover before the session.","limit":"You can provide appropriate immediate assistance and escalate urgent access, not unilaterally waive academic requirements.","documents":[{"title":"Tutor brief","body":"No note identifies who will coordinate authorised alternative formats."},{"title":"Timetable","body":"The accessible lab station has been allocated to another group."}],"choices":[{"title":"Seek authorised access arrangements urgently","why":"Contact the course director and accessibility team with a specific room and timing problem.","then":"An urgent implementation decision becomes possible.","open":"The student’s plan requires appropriate confidentiality.","signal":"Assessment access depends on coordination across roles."},{"title":"Arrange safe interim participation within authority","why":"Support what can legitimately be done while a responsible academic confirms equivalence.","then":"Some disruption may be reduced.","open":"Unauthorised improvisation must not replace the plan.","signal":"Teaching staff need explicit guidelines and time."},{"title":"Log the missing handover","why":"Report the gap so it can be addressed and reviewed beyond this assessment.","then":"A repeated risk is now documented.","open":"Harper still needs an immediate response.","signal":"Quality assurance gains evidence of failed delivery."}],"followups":[{"title":"Confirm the assessed outcome was equivalent","then":"The tutor can report practical conditions without speculating about the student’s experiences.","open":"The relevant authority decides assessment issues."},{"title":"Request paid handover time","then":"The staff plan receives an implementation question.","open":"Additional hours must be approved."}],"dossier":{"seeks":"An assessment the student can actually access","underPressure":"Unapproved improvisation or further delay","liveQuestion":"What must be confirmed before the session begins?"}}],"connections":["01","02","04","05","08","09","10"],"counterfactuals":[["Pay for verified handover across services and teaching","Administrative approval is more likely to produce access; an adequate plan is still essential."],["Put implementation evidence in the quality register","The institution can investigate failed delivery rather than report only approvals."]],"question":"When is an adjustment real: when it is approved, delivered, or usable?","threads":["Access implementation","Verified handovers","Assessment equity"],"auditExtension":{"beats":["The assessment room is still listed as available on the system, but Harper cannot use the arrangement promised in the approved plan. Arun has been given no operational instructions. An improvised alternative is suggested at the door; nobody has verified its equivalence. The faculty's 'adjustment approved' figure is unchanged.","Dalia authorises an urgent accessible alternative and Jess contacts the course team, but the booking confirmation has not reached Arun. Harper is being asked to trust an email rather than a test of the actual assessment conditions. A named owner now exists; implementation has yet to be verified.","Jess and Arun verify the assessment arrangement with the authorised course decision-maker before the session. Harper can take part without explaining the same access need to each person at the door. The faculty logs both the successful delivery and the original failed handover for system review."],"events":{"student":["Harper asks for a named person to test the actual room and format. This is a request for implementation, not another disclosure of their access needs.","Harper is offered an authorised interim format for review. They ask whether it preserves the same learning and assessment opportunity, rather than accepting mere convenience.","A student adviser helps Harper record missed access and seek the appropriate review path. The responsibility to deliver approved access remains with the university."],"coordinator":["Jess sends the approved arrangements only to authorised recipients, names the teaching-side owner and asks for a practical confirmation rather than a system tick.","Jess escalates an urgent individual response and separately reports repeated handover gaps. The two matters have different deadlines and information boundaries.","Jess offers a controlled interim pathway with the course team. She asks for equivalence to be confirmed before it is presented as a remedy."],"director":["Dalia authorises an immediate accessible arrangement and asks Arun and Jess to verify the actual room, equipment and assessment format. Approval is still not verification.","Dalia asks for a sample of approved-versus-delivered adjustments across the course, with privacy and access controls. Harper still needs a response before the assessment.","Dalia requests paid course-side implementation time and a named lead. The funding proposal is recorded; it does not move the assessment deadline."],"tutor":["Arun contacts Dalia and Jess with the room number, date and precise practical barrier. He refuses to improvise an unapproved assessment substitute.","Arun prepares a legitimate interim learning activity, while explicitly leaving assessment equivalence to authorised academic staff.","Arun documents that no handover reached him before the session. The record may support prevention, but Harper needs accessible assessment now."]},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"coordinator","text":"Jess asks the room and assessment teams for a named confirmation instead of accepting “being handled” as a delivery record."},{"role":"director","text":"Dalia asks for an immediate access check, separately from the longer systemic review."},{"role":"tutor","text":"Arun checks the actual room, equipment and materials rather than assuming a plan has travelled from another department."},{"role":"student","text":"Harper requests confirmation of what will be available on assessment day."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?"},{"id":"08","title":"The Report That Looked Better","tag":"Evidence, interpretation and missing voices","month":"September","location":"Planning and Analytics Office","domains":["Leadership","Social and cultural inclusion"],"intro":["The university is preparing its annual inclusion report. A dashboard shows an increase in students who say they feel a sense of belonging. The communications team has drafted a headline: “Belonging on the rise.” Several staff have worked hard to improve the experience; the positive result deserves serious attention.","The survey response rate varies greatly between campuses and disciplines. Short comments describe practical improvements, but others mention inaccessible procedures, exclusion in teaching groups and uncertainty about where to seek help. Some students did not answer. A student contributor, Theo, says the report seems to describe a different university from the one experienced by some of his peers.","An analyst, Samira, has flagged uncertainty in the sample. The associate provost, Charles, is under pressure to present an annual narrative to the university council and external stakeholders. He knows reports are necessarily selective and is concerned that uncertainty can be mistaken for institutional failure.","The report may be published in ten days. The choices available concern how evidence is interpreted, qualified and connected to further inquiry, not whether anyone can declare an institution welcoming on the basis of a single measure.","Mina, the analyst, has printed two versions of the same chart. One shows an encouraging overall rise in belonging. The other separates campuses and includes how few people responded at one site. Both are correct descriptions of the responses received. Only one fits comfortably on the executive summary slide. The meeting is in forty minutes."],"turn":"Council has asked for a shorter executive summary. The detailed survey analysis is complete, but the narrative has not yet been agreed. A faculty points to strong belonging scores while student-service records show rising demand for access help. Both pieces of evidence may be relevant, but neither explains the whole situation.","people":["Theo — student contributor: shares a situated concern and refuses to speak as though all students agree.","Samira — institutional analyst: works with mixed, incomplete measures and their limitations.","Charles — associate provost: responsible for honest public reporting and institutional follow-through."],"roles":[{"id":"student","name":"Theo · student contributor","position":"Student","known":"You can compare the report with experiences you know about, but cannot infer the experiences of every student.","limit":"You can offer bounded feedback and request evidence of follow-up without acting as the university’s spokesperson.","documents":[{"title":"Slide deck","body":"A headline says “More students belong.” The plotted proportion excludes a large number of nonresponses."},{"title":"Peer concern","body":"Some students ask whether their feedback will result in changes or only quotations."}],"choices":[{"title":"Ask for clear limitations alongside the claim","why":"Request that the summary explain sample differences and what the measure cannot establish.","then":"Decision-makers have an opportunity to read a more accountable claim.","open":"The institution still must decide what evidence to gather next.","signal":"Public reporting becomes more cautious about apparently positive aggregate data."},{"title":"Offer a situated account with permission boundaries","why":"Contribute a specific example and conditions for its use, without claiming to represent a whole group.","then":"The report may include more grounded context if the terms are agreed.","open":"One account is not a replacement for broader evidence.","signal":"Lived accounts prompt questions about whose voices are missing."},{"title":"Request a feedback-to-action explanation","why":"Ask what the university did with previous feedback and who can answer outstanding issues.","then":"Institutional follow-through becomes a question on the reporting agenda.","open":"A response is not proof of effective change.","signal":"Open commitments become more visible to governance."}],"followups":[{"title":"Ask which groups were missed","then":"The analysis may identify recruitment and access limits.","open":"Sampling does not confer a right to expose individuals."},{"title":"Request follow-up on a prior commitment","then":"The report can refer to what was promised and its current status.","open":"Status must be supported by evidence."}]},{"id":"analyst","name":"Samira · institutional analyst","position":"Professional staff","known":"You know sample design, missingness, response differences and the limitations of survey comparisons. You do not know why every person did or did not respond.","limit":"You can advise on analytical integrity, explain uncertainties and recommend further inquiry, not declare institutional outcomes.","documents":[{"title":"Response pattern","body":"The response rate is materially lower in one campus and among particular enrolment arrangements."},{"title":"Metric note","body":"“Belonging” is captured by one question; other surveys use different wording."}],"choices":[{"title":"Publish a qualified disaggregation","why":"Provide appropriate group patterns, privacy protections and explicit uncertainty alongside the headline.","then":"Some differences become visible without pretending to precision unsupported by the data.","open":"Further investigation is necessary.","signal":"Institutional evidence becomes more nuanced and may reveal uneven experiences."},{"title":"Triangulate other governed evidence","why":"Propose ethical comparison with access records, feedback and appropriately gathered qualitative accounts.","then":"The institution can examine apparently conflicting signals more carefully.","open":"Records were created for different purposes and cannot simply be merged.","signal":"Earlier service and partnership traces become relevant to the report."},{"title":"Audit who was not captured","why":"Examine recruitment, formats, language and response patterns before repeating the survey.","then":"A more inclusive evidence design becomes possible.","open":"Future data collection still requires consent and access.","signal":"Evidence gaps become a concrete institutional design question."}],"followups":[{"title":"Keep assumptions visible in the summary","then":"Readers can see the limits behind an apparently simple number.","open":"Technical notes need accessible interpretation."},{"title":"Recommend a follow-up inquiry owner","then":"There is a clear proposal for responsibility.","open":"Recommendation does not equal authorisation."}]},{"id":"executive","name":"Charles · associate provost","position":"Institutional executive","known":"You see institutional reports and external pressures. The dashboard is attractive, but the analyst has flagged limitations.","limit":"You can require credible reporting, assign inquiry owners and avoid unsubstantiated claims.","documents":[{"title":"Draft release","body":"“Accreditation recognised. Belonging continues to rise across Riverlands.” A footnote carries caveats."},{"title":"Action register","body":"Several improvements are recorded as “in progress” with inconsistent supporting evidence."}],"choices":[{"title":"Release a qualified account of progress","why":"Report strengths, variation, uncertainty and outstanding commitments in the main narrative.","then":"The report becomes more informative while remaining readable.","open":"Claims need follow-up beyond publication.","signal":"Institutional storytelling becomes more accountable to unresolved conditions."},{"title":"Delay selected claims for verification","why":"Publish what is supported and withhold claims requiring further checking, with an explanation.","then":"Accuracy takes priority over an uncomplicated announcement.","open":"A plan and timeline for verification are still needed.","signal":"Uncertainty receives an explicit governance owner."},{"title":"Commission targeted participatory inquiry","why":"Fund appropriately supported engagement to understand differences and examine possible responses.","then":"Those experiencing barriers may help shape a better question if they choose.","open":"Consultation risks extractive repetition without clear ownership and reciprocity.","signal":"Evidence work becomes linked to paid participation and community trust."}],"followups":[{"title":"Publish a commitments ledger","then":"Council can distinguish promises, actions, and unresolved evidence.","open":"An entry is not completion."},{"title":"Request an independent reading of the report","then":"An external challenge can reveal assumptions missed internally.","open":"Independence must be substantive, not ceremonial."}]},{"id":"studentservices","name":"Leo · student-services manager","position":"Professional services","known":"You see service utilisation patterns and information about access barriers. You do not know how these translate into survey respondents’ experiences.","limit":"You can propose responsible comparisons and address service weaknesses, not claim that a single metric measures belonging.","documents":[{"title":"Service log","body":"Advice contacts and queue length rose as some student experience survey results improved."},{"title":"Data limitation","body":"Service records cannot be joined to individual survey records without appropriate governance."}],"choices":[{"title":"Provide bounded service evidence","why":"Summarise wait-time trends and limitations for the report.","then":"The report gains a different institutional signal.","open":"Increased contacts have multiple possible explanations.","signal":"Reporting integrity must integrate service capacity."},{"title":"Request participatory access inquiry","why":"Seek a supported way to understand barriers beyond queue statistics.","then":"Student voices may inform a better service question.","open":"Participation must not be burdensome or coercive.","signal":"Evidence and care capacity become linked."},{"title":"Challenge unsupported service success claims","why":"Ask that access improvements be described with actual implementation evidence.","then":"A headline may become more accurate.","open":"Some real improvements may still warrant recognition.","signal":"Public claims become conditional on measured delivery."}],"followups":[{"title":"Include a service implementation owner","then":"Any proposed action has a named responsible team.","open":"Owner identification does not resource the work."},{"title":"Protect personal service information","then":"The review can avoid inappropriate record merging.","open":"Uncertainty remains and must be reported."}]}],"connections":["01","03","04","05","06","07","10"],"counterfactuals":[["Commission a careful mixed-methods inquiry","Contradictory signals can be examined; no predetermined outcome follows."],["Make previous institutional commitments visible","Readers can distinguish observed changes from aspirations and pending actions."]],"question":"What does the apparently positive number permit the university to claim?","threads":["Evidence limits","Reporting integrity","Missing voices"],"auditExtension":{"beats":["The draft annual report highlights a positive overall belonging figure. At the next analyst meeting, a staff member asks whether responses from a smaller campus were pooled with the main site. The slide deck contains the overall percentage, but no subgroup response counts. A reassuring average has travelled faster than its limitations.","The analyst adds campus-level response counts and uncertainty notes to the briefing. The executive team sees that the aggregate trend and particular concerns can both be true. An amendment to the narrative is still contested, because some believe it will dilute recognition of hard-won progress.","Leadership authorises a qualified public account and targeted follow-up with affected groups, using voluntary and appropriately governed participation. The next report will show whether the inquiry was completed; a more careful chart does not itself improve the conditions being measured."],"events":{},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"analyst","text":"Mina retains the disaggregated results and records low response rates alongside the overall pattern."},{"role":"studentservices","text":"The student-services team cautions that support enquiries, satisfaction and safety are different kinds of evidence."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?","workConditions":{"possibleHazard":"Time pressure, organisational justice and conflicting reporting expectations","potentiallyAffectedWorkers":"Samira, Leo and reporting/support teams","designCheck":"Check safe escalation, protected analysis time, truthful reporting and workload changes caused by additional evidence requests.","note":"Fictional authoring check, not a risk assessment or determination of compliance."}},{"id":"09","title":"The Placement No One Could Afford","tag":"Placement access, unpaid labour and community responsibility","month":"October","location":"Professional Placements Office","domains":["Teaching, learning and research","Social and cultural inclusion","Leadership"],"intro":["The professional placements team celebrates a record number of placement agreements. The new placement model promises valuable learning and stronger partnerships with local organisations. Most students will work several weeks away from ordinary paid employment, and some will travel to services across Victoria.","Amara, a mature-age student with caring responsibilities, has been allocated a high-quality placement ninety minutes from home. The required hours clash with paid work and school pick-up. The university placement letter says participation is compulsory and travel assistance is limited. Amara wants the learning opportunity, but cannot make the current arrangement work without risking the household’s income.","Milan, the placement coordinator, has matched scarce placements across a large cohort. Host supervisor Asha, from a community organisation already under pressure, says she can support some flexibility but has no extra funding to supervise new schedules. Dean Joseph believes that consistent professional standards matter and that expanding financial assistance would require a faculty decision.","Each person can point to something important: learning integrity, equity, host capacity, student finances and the responsibilities of a professional course. The problem is how these conditions interact, not whether one person is sufficiently motivated.","Amara spreads three timetables on the kitchen bench: placement hours, paid shifts, and the school pickup arrangement. Every version leaves a gap she cannot cover. Milan, the placement coordinator, says a host may be willing to try different hours. Asha, the host supervisor, has already told another university that her team cannot safely supervise an extra person without planning support."],"turn":"The placement start date has arrived. Another student accepts an unsuitable timetable and says they will “just manage.” The host organisation has reached its supervision limit, and a government grant application for future placements has not yet been decided.","people":["Amara — student and carer: has a legitimate place in the course and limited room to replace paid work.","Milan — placement coordinator: manages supply, agreements and real-time student communication.","Asha — community host: responsible for safe supervision and organisational capacity.","Joseph — dean: accountable for curriculum integrity, equitable access and resources."],"roles":[{"id":"student","name":"Amara · placement student","position":"Student","known":"You know your family timetable and work income. You do not know all alternative placements or the agreements with hosts.","limit":"You may request reasonable alternatives, hardship support and advice within professional requirements.","documents":[{"title":"Offer letter","body":"“Attendance is mandatory. Any variation requires approval.” No specific hardship route is described."},{"title":"Budget note","body":"The placement would remove income required for rent and after-school care."}],"choices":[{"title":"Request an approved flexible placement","why":"Ask about equivalent hours, timing and an alternative within professional accreditation requirements.","then":"The coordinator investigates actual availability and approval routes.","open":"Flexibility must be real and supported by hosts.","signal":"Placement matching and host coordination require additional labour."},{"title":"Seek hardship and support advice","why":"Request current financial assistance and a named decision contact without assuming funding exists.","then":"Amara receives clearer information and may submit an eligible request.","open":"A loan or one-off grant may not meet the structural cost.","signal":"Student support sees costs hidden by placement completion data."},{"title":"Question the allocation criteria","why":"Ask for transparent placement matching and a review of access impacts across students.","then":"A structural equity question enters the academic process.","open":"The approaching placement still requires an individual response.","signal":"Institutional evidence gains a distributional fairness concern."}],"followups":[{"title":"Check the actual feasibility of the adjustment","then":"Amara can assess whether the revised placement protects learning and livelihood.","open":"No student should have to conceal hardship to proceed."},{"title":"Ask what the university learned","then":"The system can record an access problem beyond this single case.","open":"The student cannot be assigned the reform task."}],"dossier":{"seeks":"An approved placement that fits essential living commitments","underPressure":"An offer that is technically accepted but impossible to complete","liveQuestion":"What schedule and support are actually feasible?"}},{"id":"coordinator","name":"Milan · placement coordinator","position":"Professional staff","known":"You can see vacant places, host conditions and student allocation records. You cannot create new host capacity overnight.","limit":"You can propose authorised alternatives, escalate hardship questions and document access patterns.","documents":[{"title":"Allocation list","body":"Many placements are distant from public transport and concentrated in daytime hours."},{"title":"Support rules","body":"Travel funding has narrow eligibility and no transparent annual review."}],"choices":[{"title":"Negotiate an equivalent placement alternative","why":"Work with Amara and an authorised host on feasible learning hours and safeguards.","then":"A revised allocation may be possible at real coordination cost.","open":"Some students may remain without viable choices.","signal":"Placement equity depends on staff time and host capacity."},{"title":"Document the access pattern for governance","why":"Report de-identified travel, care and income constraints alongside allocation outcomes.","then":"The problem can be considered beyond the exception queue.","open":"Near-term placements still need support.","signal":"The metrics of successful placements become more contested."},{"title":"Escalate a resourced hardship pathway","why":"Seek an accountable decision on paid travel, care support or alternative delivery where permitted.","then":"The faculty has a costed question rather than a plea for goodwill.","open":"Resources and professional requirements need explicit consideration.","signal":"Budget deliberation gains a placement support obligation."}],"followups":[{"title":"Check placements for unintended withdrawals","then":"The team may detect inequitable attrition obscured by offers accepted.","open":"Monitoring requires ethical, appropriate data use."},{"title":"Revisit host workload agreements","then":"The institution can examine whether placements externalise labour to partners.","open":"The host retains the right to decline."}],"dossier":{"seeks":"A professionally valid and workable allocation","underPressure":"Treating acceptance rates as successful access","liveQuestion":"Which host capacity and student costs remain unverified?"}},{"id":"host","name":"Asha · community host supervisor","position":"Community partner","known":"You know local service capacity, supervision commitments and the value of placement learners. You cannot authorise academic requirements.","limit":"You can set safe placement limits, negotiate supervision terms and decline unsafe or unfunded demands.","documents":[{"title":"Supervision roster","body":"Two experienced staff are already covering additional placement work."},{"title":"Agreement","body":"The document thanks hosts but provides no supervision payment and little flexibility guidance."}],"choices":[{"title":"Offer bounded flexibility with clear support","why":"Outline an equivalent schedule you could supervise if the university resources coordination and approval.","then":"A workable arrangement may emerge on negotiated terms.","open":"The host cannot guarantee capacity without resources.","signal":"Community goodwill enters an explicit resourcing discussion."},{"title":"Decline additional unresourced supervision","why":"Set a safe boundary on further placements this period.","then":"The centre protects service quality while the university must reassess placement allocation.","open":"Student needs still require an institutional response.","signal":"Placement counts can fall while host responsibility improves."},{"title":"Ask for genuine partnership redesign","why":"Request payment, shared planning and a voice in what learning activities can be supported.","then":"Future placements may be more reciprocal.","open":"The present student’s deadline still needs a safe decision.","signal":"Host agency and university outcomes become linked in governance."}],"followups":[{"title":"Review how the host’s contribution is reported","then":"The partnership record can reflect actual supervision effort.","open":"Recognition does not itself add staff time."},{"title":"Set a cap for the next intake","then":"The centre can signal realistic future capacity.","open":"University allocation decisions must adapt."}],"dossier":{"seeks":"Safe supervision without hidden cost transfer","underPressure":"Pressure to host beyond capacity","liveQuestion":"What bounded commitment could you offer, if any?"}},{"id":"dean","name":"Joseph · faculty dean","position":"Academic leadership","known":"You know professional learning requirements and a constrained faculty budget. You have not seen the full distribution of student hardship.","limit":"You can authorise equitable options within relevant standards and propose targeted funding.","documents":[{"title":"Faculty paper","body":"Placement completion is high, but deferral and withdrawal reasons are incomplete."},{"title":"Funding envelope","body":"The faculty has a small discretionary fund and no ongoing subsidy commitment."}],"choices":[{"title":"Fund a targeted access pathway","why":"Propose accountable support and authorised placement flexibility for students facing substantial barriers.","then":"Some students can participate without an inequitable private cost.","open":"Funding adequacy and host capacity need review.","signal":"The institutional budget inherits a concrete access investment."},{"title":"Commission a placement-equity redesign","why":"Review location, hours, unpaid time and host costs with appropriately paid student and partner input.","then":"The faculty can understand structural distribution of costs.","open":"The current intake needs immediate arrangements.","signal":"Partnerships and evidence collection become interdependent."},{"title":"Prioritise host capacity and quality assurance","why":"Fund supervision training and negotiated placements within realistic host limits.","then":"The quality and reliability of places may improve.","open":"Student income and travel barriers remain.","signal":"Community reciprocity becomes a curriculum and resource condition."}],"followups":[{"title":"Check actual student participation after allocation","then":"Completion reporting can reflect access costs as well as offers accepted.","open":"The data must be interpreted carefully."},{"title":"Return with a funded decision proposal","then":"The faculty can compare concrete options rather than slogans.","open":"Approval and implementation are still distinct."}],"dossier":{"seeks":"Equitable participation and sustainable partnerships","underPressure":"Approving funding that does not produce a viable placement","liveQuestion":"What resources are authorised, and what outcome still needs checking?"}}],"connections":["01","04","06","07","08","10"],"counterfactuals":[["Fund hardship support and permitted flexible hours","A placement may become materially feasible; professional learning and host capacity still matter."],["Pay hosts for supervision and co-design","Partnerships may be more sustainable without obliging hosts to participate."]],"question":"Who bears the true cost of a placement that is recorded as “offered”?","threads":["Placement equity","Student livelihood","Host reciprocity"],"auditExtension":{"beats":["Amara reads the compulsory placement letter beside a roster for paid shifts and school pick-up. The proposed placement would require several weeks of travel she cannot afford. Asha's service has reached its supervision limit. The admissions record still marks Amara as 'allocated', which says almost nothing about whether attendance is possible.","Milan identifies a possible alternative schedule, but Asha explains that the host cannot absorb additional coordination without a change to its agreement. Amara can consider the new proposal, although approval, timing and actual financial feasibility remain unresolved. The university has shifted work to the negotiation stage, not solved the access problem.","Amara receives a feasible alternative subject to appropriate professional approval and can review the hours against paid work and caring responsibilities. The host's supervision limit is respected and named coordination is funded. The faculty begins a broader review of students who accept unworkable arrangements because they fear losing their place."],"events":{"student":["Amara provides a feasible time window and asks to compare it with authorised placement hours. The allocation record remains provisional while actual host capacity is checked.","Amara asks a named adviser about assistance, including eligibility for relevant government and university programs. She cannot budget household income against unconfirmed support.","Amara requests a review of the matching criteria. Her request exposes a wider pattern without obliging her to organise other students."],"coordinator":["Milan contacts two authorised hosts about an equivalent schedule. One declines for capacity reasons; the second asks who will pay for the extra supervision coordination.","Milan finds accepted offers that required long unpaid travel and de-identifies the information for planning. The acceptance figure had concealed precarious participation.","Milan requests funded travel or care support subject to applicable rules. The finance team needs an actual eligibility and resource decision, not an inspirational statement."],"host":["Asha offers hours she can safely supervise if the university confirms transport, approval and coordination support. Her agreement does not extend to a second unresourced student.","Asha declines another placement this period. The university must find a viable alternative rather than treating the host boundary as failure to cooperate.","Asha requests paid shared planning and a revised agreement. The university now has a partnership decision to make, not permission to assume free supervision."],"dean":["Joseph allocates a bounded student-support proposal for authorised assessment, subject to eligibility and institutional approval. Funding creates options; it cannot create host capacity.","Joseph commissions a compensated review with students and partners. The report may challenge existing allocation metrics but cannot solve Amara’s next-week timetable alone.","Joseph prioritises host support and quality assurance; Amara’s household cost remains unresolved unless flexible matching or support is also negotiated."]},"sourceRevision":"2026-10-14 v1.2 audit remediation"},"autonomous":[{"role":"coordinator","text":"Milan makes an initial enquiry to an approved host rather than labelling the original allocation “accepted”."},{"role":"host","text":"Asha tells the university she will not take another student without adequate supervision capacity."},{"role":"dean","text":"Joseph asks staff to establish both the student’s actual eligibility for assistance and the host’s available capacity."},{"role":"student","text":"Amara checks the proposed hours against work and care; accepting an offer cannot be assumed."}],"reviewLens":"Provision → enactment → encounter → revisit: which transition is evidenced, whose burden is visible, and who has authority over the next step?"},{"id":"10","title":"The Budget Meeting After Accreditation","tag":"Consequential integration: contested priorities, inherited conditions and limited funds","month":"November","location":"University Council Annex","domains":["Leadership","Social and cultural inclusion","Teaching, learning and research","Places and spaces"],"intro":["The year after accreditation is nearly over. Nine different areas of university life have produced demands, experiments, tensions and open commitments. Riverlands is preparing its next strategic plan. The institution has achieved things that matter: improved access to some services, thoughtful curriculum work and relationships strengthened by people who persisted through uncertainty. The university has also accumulated unanswered questions.","Budgets are tight. An accessible room booking system needs work, assessment adjustments remain uneven, placement access creates hardship, teaching contracts are being renewed, and several community relationships require decisions about future investment. The council papers contain reassuring indicators of success alongside incomplete action records. Staff preparing the papers have different views about which commitments are genuinely sustainable.","Lena, a student representative, argues that difficult experiences should remain visible in the planning process. Omar, the inclusion lead, has a list of outstanding commitments and no guarantee of staff time to pursue all of them. Deputy vice-chancellor Ruth must advise council on priorities, trade-offs and what the institution can responsibly claim.","There is no single action that can complete the work of being welcoming. This final module is a meeting point: whichever scenarios participants have engaged with, their authored open threads may appear in the papers. Participants can begin here independently, but a longer pathway changes what they can bring into view.","The council secretary has added three small letters beside several items: P for proposed, I for implemented, and V for verified. On the draft paper, all three categories had been called “progress.” Lena, the student representative, circles a sentence about improved access and asks whether anyone checked that the support actually reached students. The chair leaves the question on the table."],"turn":"Council has authorised a hypothetical planning envelope of five discretionary units for the immediate post-accreditation cycle. Existing statutory and policy obligations remain binding outside this envelope. The participants must recommend an affordable package that accounts for what was already resourced, what remains unanswered and what the university cannot honestly claim to have achieved.","people":["Lena — student representative: seeks accountable participation without carrying the institution’s work alone.","Omar — inclusion lead: understands the accumulation of commitments and the limits of his small team.","Ruth — deputy vice-chancellor: must recommend real resource and governance decisions, not simply endorse aspirations."],"roles":[{"id":"student","name":"Lena · student representative","position":"Student voice","known":"You know student priorities and your representative limits. You may have seen some other scenario threads but cannot represent every constituency.","limit":"You can press for transparency, participation and follow-up without committing university budgets.","documents":[{"title":"Council extract","body":"“Maintain commitment to inclusion.” No responsible owner or delivery date is attached."},{"title":"Representative notes","body":"Some students appreciate improved services; others ask what happened to earlier feedback."}],"choices":[{"title":"Request an accountable commitments register","why":"Ask for named decision owners, status and accessible explanations of unresolved work.","then":"Council receives a clearer question about follow-through.","open":"Publication must protect confidentiality and cannot force disclosure.","signal":"Unresolved matters become harder to hide in celebratory reporting."},{"title":"Seek shared review of priorities","why":"Propose appropriately resourced participation by affected students and community partners before trade-offs are closed.","then":"Decision-making may gain more situated information.","open":"Participation must be meaningful, not an extra unpaid burden.","signal":"Institutional planning inherits a reciprocal participation commitment."},{"title":"Challenge a specific unsupported claim","why":"Identify one gap between asserted progress and available evidence and ask for clarification.","t ort and which have only been promised.","then":"The envelope can be discussed without double-counting commitments.","open":"Some authorisations may remain undocumented.","signal":"Institutional memory changes what new resources are needed."},{"title":"Offer a staged resourcing proposal","why":"Present conditions for phased action and scheduled reconsideration.","then":"Some opportunities can remain open instead of being falsely completed.","open":"Delays have human consequences and require safeguards.","signal":"Timing becomes part of accountability, not just accounting."}],"followups":[{"title":"Demand implementation evidence at review","then":"Plans can be compared against actual uptake and effects.","open":"No funding decision guarantees an outcome."},{"title":"Expose what is not costed","then":"The next review can address missing labour and externalised burdens.","open":"Some values cannot be reduced to units."}]}],"connections":["01","02","03","04","05","06","07","08","09"],"counterfactuals":[["Make existing commitments and authority visible","Council can discuss trade-offs with a clearer record of what remains open."],["Allocate decision-making time and follow-up resources","Institutional review becomes more feasible, but not necessarily effective."]],"question":"Which commitments can be sustained, reconstructed, refused, released or responsibly ended?","threads":["Open commitments from earlier scenarios","Fictional discretionary units","Role-bounded budget recommendations","Revisable institutional agenda"],"auditExtension":{"beats":["The council paper arrives with a long list of aspirations and a five-unit discretionary envelope. Several compliance and access duties pre-date this meeting and must be addressed regardless of what optional proposals are selected. The chair asks which achievements can actually be verified and who will own the unfinished work.","A draft package allocates discretionary planning effort, but its assumptions are contested. Student and hway can remain inaccessible in practice."},{"from":"04","to":"07","text":"The teaching handover exposes whether course staff receive paid time and clear responsibility for adjustments when personnel change."},{"from":"05","to":"03","text":"A teaching-team response alters the context in which students decide whether to seek institutional advice, without establishing any allegation."},{"from":"06","to":"10","text":"A paused or redesigned project leaves an unresolved governance question; cultural authority cannot be traded for discretionary budget convenience."},{"from":"07","to":"08","text":"Approved adjustments and successfully delivered adjustments are different denominators; a headline approval count may mislead."},{"from":"08","to":"10","text":"An evidence caveat should travel with the council report instead of disappearing when a figure becomes a headline."},{"from":"09","to":"10","text":"Placement offers and feasible participation diverge; budget debate should include both student and host costs."},{"from":"04","to":"10","text":"Paid transition and support capacity appear in the commitments ledger, whether implemented, proposed or still awaiting a decision."},{"from":"03","to":"08","text":"Low formal-report counts cannot be used alone to infer safety or trust; appropriate qualitative evidence remains necessary."},{"from":"03","to":"10","text":"A new reporting route may shift time and emotionally demanding work into already stretched support teams; the employer must consider the resulting work conditions."},{"from":"03","to":"06","text":"Lessons about workload and role clarity from supporting sensitive concerns inform how project staff are resourced for difficult institutional consultation."},{"from":"06","to":"08","text":"Correcting an overstated consultation claim can create urgent reporting work. The university must account for time, authority and safe escalation, not only the accuracy of its published text."}]};

function showSituation(s){let v=header(s,'Shared institutional situation')+`<p>Decisions from different roles coexist here. This record shows what participants explored in the fictional world; it does not establish that those things happened in an actual university.</p>${stateTiles(s.id)}<h3>Actor-specific decisions</h3>${showActorLog(s.id)}<details><summary>Explore capacity and relational conditions</summary><div><p>Consider time, attention, material resources, safety, relationships and recovery separately. There is no single wellbeing score, optimal choice, or moral colour.</p><p>Which conditions belong to an individual, to a team, or to the institution? Who can alter them?</p></div></details><h3>Linked conditions</h3>${workPanel(s.id)}${linksHTML(s.id)}`+buttons([B('Choose or change role','roles'),B('Later developments','later','','soft'),B('Review whole ecology','review','','light')]);return panel(s.title,'Inspect the current state and its provenance',v,`Scenario ${s.id}`)}
function showReflection(s){let f=data.reflections[s.id]||{};let v=header(s,'06 · Optional reflection')+`<h2>What shifted, if anything?</h2><p>The scenario may remain unresolved. You can leave without writing, revisit another position or explore the wider institutional ecology. This is not an assessment of you.</p>${[['noticed','What became visible from this position?'],['conditions','What institutional condition would you consider changing?'],['unresolved','What remains unresolved, or requires another person’s authority?']].map(([k,q])=>`<div class="feedback"><label>${q}<textarea data-ref="${k}" placeholder="Optional. You control whether this is exported.">${esc(f[k]||'')}</textarea></label></div>`).join('')}<details><summary>Optional possibility inquiry</summary><div><p><strong>What relationship or arrangement could change?</strong></p><p>For whom would it matter, what burdens might move, and what would make a response answerable? An imaginable possibility may still need authority, resources, implementation and evidence.</p></div></details><div class="ribbon">Counterfactuals remain proposals until separately decided, authorised and implemented. This session does not create commitments for a real institution.</div>`+buttons([B('Revisit another role','roles','','soft'),B('Scenario map','map'),B('Review my pathway','review','','light')]);return panel(s.title,'Reflection is optional. Leave and return whenever you wish.',v,`Scenario ${s.id}`)}

function investmentCost(id){let s4=state('04'),s7=state('07'),s9=state('09');if(id==='support')return s4.verified?1:2;if(id==='access')return s7.verified?1:2;if(id==='placements')return s9.feasible?1:2;if(id==='teaching')return primaryCount('05')>=2?1:2;if(id==='partnership')return primaryCount('06')>=2?1:2;if(id==='evidence')return primaryCount('08')>=2?1:2;return 2}
function signature(){return JSON.stringify(SCENES.filter(s=>s.id!=='10').map(s=>[s.id,s.roles.map(r=>[r.id,exists(first(s.id,r.id))?first(s.id,r.id):null,exists(later(s.id,r.id))?later(s.id,r.id):null])]))}
function budgetCheck(){let a=data.allocation,ids=a?.ids||[];let value=ids.reduce((n,id)=>n+investmentCost(id),0);return {ids,value,stale:!!a&&a.signature!==signature(),within:value<=5}}

 xs.push({id:'student-safety',label:'Appropriate response to racism and harassment',detail:s3.supported?'A support route has been proposed; its timeliness and effect remain to verify.':'Student support and response responsibilities cannot be inferred satisfied from complaint totals.',source:'03'});

function budgetPanel(){let saved=data.allocation,old=saved?.ids||[],ids=ui.budgetDraft===null?old:ui.budgetDraft,cost=ids.reduce((n,id)=>n+investmentCost(id),0),bc=budgetCheck();return `<section class="budget-panel"><h2>Planning beyond accreditation</h2><p>The fictional council permits <strong>five discretionary planning units</strong>. These are not actual dollars or permission to defer rights and existing institutional duties. Select a proposal to consider—not an action already completed.</p><div class="ribbon rose"><strong>Responsibilities outside the five-unit envelope</strong><ul class="list">${obligations().map(o=>`<li><b>${esc(o.label)}</b> — ${esc(o.detail)}</li>`).join('')}</ul></div><div class="choices">${PROPOSALS.map(item=>`<button class="choice ${ids.includes(item.id)?'selected':''}" data-action="toggle-plan" data-id="${item.id}" aria-pressed="${ids.includes(item.id)}"><span class="tick">${ids.includes(item.id)?'☑':'□'}</span><strong>${esc(item.title)} · ${investmentCost(item.id)} planning unit(s)</strong><span>${esc(item.desc)}</span></button>`).join('')}</div><div class="ribbon ${cost>5?'rose':''}"><strong>Proposed: ${cost} / 5 planning units.</strong> ${cost>5?'Exceeds the fictional envelope; an additional governance or resourcing decision is required.':'Within the illustrative envelope, subject to scrutiny and approval.'}</div>${saved?`<div class="ribbon ${bc.stale?'rose':''}"><strong>${bc.stale?'Prior proposal needs reconsideration.':'Previously recorded proposal.'}</strong> ${bc.stale?'Earlier role decisions have since changed the planning assumptions. No previous approval is presumed.':'The proposal remains tied to its recorded underlying conditions.'} It is a recommendation, not an enacted budget.</div>`:''}<div class="btnrow">${B('Record this proposal','commit-plan','','smallbtn')}${B('Leave unresolved','skip-plan','','light smallbtn')}</div></section>`}
function showReview(){let vis=SCENES.filter(s=>data.visited.includes(s.id)||total(s.id)),bc=budgetCheck();
 let body=`<p>Review fictional decisions, independently authored actions, and open responsibilities. This is a pathway record, never an inclusion score or a record of actual institutional action.</p><div class="statrow"><span>${vis.length} scenes explored</span><span>${SCENES.reduce((n,s)=>n+total(s.id),0)} participant-selected decisions</span></div>`+

 `<h2>Work conditions carried forward</h2>${['03','04','06','08','10'].filter(id=>data.visited.includes(id)||total(id)).map(id=>{let t=workTrace(id);return `<div class="thread"><strong>${id} · ${esc(t.stage)}</strong>${esc(t.transfer)} <span class="small">Still requires situated assessment and review.</span></div>`}).join('')}`+
  `<h2>Commitments worth revisiting</h2>${obligations().map(o=>`<div class="thread"><strong>${esc(o.label)} · scene ${o.source}</strong>${esc(o.detail)}</div>`).join('')}`+
 `<div class="ribbon ${bc.stale?'rose':'amber'}"><strong>Scenario 10:</strong> ${data.allocation?(bc.stale?'Earlier conditions changed; the planning proposal requires reconsideration.':'Discretionary proposal recorded, not implemented.'):'No discretionary proposal recorded.'} Responsibilities outside the optional envelope remain.</div>`+
 `<details><summary>Private reflections</summary><div>${Object.entries(data.reflections).map(([sid,fs])=>`<h3>Scene ${esc(sid)}</h3>${Object.entries(fs).filter(([k,v])=>v).map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}`).join('')||'<p>No written reflections.</p>'}</div></details>`+
 `<details><summary>Revision history (${data.log.length})</summary><div><ol>${data.log.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ol></div></details>`+
 `<div class="quiet"><strong>Data control:</strong> No information is transmitted. Private exports include reflections; team exports exclude them. Please review files before sharing.</div><div class="btnrow" style="margin-top:18px">${B('Export private pathway','export')}${B('Export team dossier','export-team','','light')}${B('Team comparison','team','','soft')}${B('Print / PDF','print','','light')}${B('Clear this session','clear','','danger')}</div><div class="saving"><label><input type="checkbox" data-action="save" ${ui.save?'checked':''}> Save on this device (off by default)</label></div>`;

function showAbout(){return panel('How Plaethru works','Development preview v1.3 · offline, authored, provisional',`<p>Ten fictional situations, each playable independently. Choose a role and make a decision within its actual authority, switch roles without erasing another person's choice, or observe alternative pathways without choosing. Work-condition consequences are authored and visible in five relevant scenarios; the underlying WorkSafe rationale is optional reading.</p><ol class="list"><li>Open any scenario and read the short opening.</li><li>Select a role, read the available documents and commit a provisional response, if desired.</li><li>Read the resulting account, change roles, or examine the contingent later development.</li><li>Choose an optional later response, review the record or revisit any actor's earlier choice.</li><li>See which conditions have travelled to later scenarios; return to the map at any point.</li></ol><h3>Work-design and risk-transfer safeguard</h3><p>Selected stories include a Dapple-informed check of possible employee psychosocial hazards, controls, shifted demands and review. It is visible only where relevant, never converted to a wellbeing score, and does not authorise users to make legal or clinical judgements. Victorian WorkSafe obligations remain distinct from student access, cultural authority and the Welcoming Universities Standard.</p><p class="small"><a href="https://www.worksafe.vic.gov.au/compliance-code-psychological-health-part-1-introduction" target="_blank" rel="noopener noreferrer">WorkSafe Victorian compliance-code introduction</a> · <a href="https://www.worksafe.vic.gov.au/compliance-code-psychological-health-part-3-step-3-control-risks" target="_blank" rel="noopener noreferrer">Risk controls</a> · <a href="https://www.worksafe.vic.gov.au/compliance-code-psychological-health-part-3-step-4-review-risk-controls" target="_blank" rel="noopener noreferrer">Review</a>.</p><h3>Boundaries</h3><p>Every rule and narrative development is authored, not generated by AI. The browser calculates consequences for this fictional institution only. The model does not decide whether a complaint is substantiated, whether someone has met legal requirements, or what First Nations cultural authorities should do. Some choices represent requests or proposals, not implementation. In three reference scenarios (04, 07, 09), independent actor decisions are conditional authored responses that may be revised if you choose their role. This is a simulation of possible trajectories, not a model of actual human decision-making. Expert and lived-experience review are still required before consequential institutional trials.</p><p>Scenarios are grouped into three suggested weekly encounters (3 + 3 + 4), but none requires completion of an earlier scenario. Later visits to earlier scenes change the present interpretation, not the fictional past.</p><h3>Data</h3><p>Runs entirely offline. Session decisions remain in this tab, with optional browser saving; manual exports never upload data. Team comparison can import a deliberately limited team dossier and presents conflicts for explicit resolution.</p>`+buttons([B('Explore university ecology →','map'),B('Review my pathway','review','','light')]))}
function exportJSON(obj,filename){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1800);note('File prepared. Review before sharing.')}
function teamData(){return {format:'wu-plaethru-team-v1.3',description:'Fictional role decisions only. No participant identity or reflections.',actions:data.actions,allocation:data.allocation?{ids:data.allocation.ids}:null}}
function downloadTeam(){exportJSON(teamData(),'WU_Plaethru_team_dossier_v1_3.json')}
function validateTeam(o){if(!o||o.format!=='wu-plaethru-team-v1.3'||!o.actions||typeof o.actions!=='object')throw Error('Not a valid v1.3 team dossier');let valid={};for(let s of SCENES){let incoming=o.actions[s.id];if(!incoming||typeof incoming!=='object')continue;for(let r of s.roles){let v=incoming[r.id];if(!v||typeof v!=='object')continue;let out={};if(Number.isInteger(v.first)&&v.first>=0&&v.first<r.choices.length)out.first=v.first;if(Number.isInteger(v.later)&&v.later>=0&&v.later<r.followups.length)out.later=v.later;if(Object.keys(out).length){(valid[s.id]??={})[r.id]=out}}}return valid}
function comparisons(candidate){let conflict=[],add=[];for(let s of SCENES){for(let r of s.roles){let inc=candidate[s.id]?.[r.id];if(!inc)continue;for(let phase of ['first','later']){let x=inc[phase];if(!exists(x))continue;let old=actor(s.id,r.id)[phase];let item={sid:s.id,role:r.id,phase,old,idx:x,label:`${s.id} · ${r.name} · ${phase==='first'?'initial':'later'}`};if(exists(old)&&old!==x)conflict.push(item);else if(!exists(old))add.push(item)}}}return {conflict,add}}
function showTeam(){const candidate=ui.mergeInput,cm=candidate?comparisons(candidate):null;return panel('Compare team pathways','Opt-in facilitation; merge by actor and decision stage',`<p>Paste a downloaded <strong>team dossier JSON</strong> into the field. No personal reflections or participant identities are required. The app previews conflicts and asks you explicitly which fictional choices to retain.</p><label for="teamInput" class="minorhead">Dossier JSON</label><textarea id="teamInput" rows="5" class="team-text" placeholder="Paste exported team dossier JSON here"></textarea><div class="btnrow" style="margin-top:10px">${B('Preview dossier','preview-team')}${B('Clear preview','reset-team','','light')}</div>${cm?`<div class="ribbon"><strong>${cm.add.length} additional decisions</strong> and <strong>${cm.conflict.length} conflicts</strong> identified. Only decisions that pass validation can enter the merged record.</div>${cm.conflict.map((c,i)=>{let r=roleFor(c.sid,c.role),options=c.phase==='first'?r.choices:r.followups;let value=ui.conflictSelections[`${c.sid}:${c.role}:${c.phase}`]||'mine';return `<div class="merge-conflict"><strong>${esc(c.label)}</strong><p><b>My pathway:</b> ${esc(options[c.old].title)}<br/><b>Incoming:</b> ${esc(options[c.idx].title)}</p><label><input type="radio" name="conflict-${esc(c.sid+':'+c.role+':'+c.phase)}" data-conflict="${esc(c.sid+':'+c.role+':'+c.phase)}" value="mine" ${value==='mine'?'checked':''}> Retain my decision</label><label><input type="radio" name="conflict-${esc(c.sid+':'+c.role+':'+c.phase)}" data-conflict="${esc(c.sid+':'+c.role+':'+c.phase)}" value="incoming" ${value==='incoming'?'checked':''}> Adopt incoming decision</label></div>`}).join('')}${B('Apply explicit team resolution','apply-team')}`:''}${buttons([B('← Review','review','','light'),B('Return to map','map','','soft')])}`)}
function applyTeam(){if(!ui.mergeInput)return;let cm=comparisons(ui.mergeInput),n=0;for(let c of [...cm.add,...cm.conflict]){let id=`${c.sid}:${c.role}:${c.phase}`,adopt=!exists(c.old)||ui.conflictSelections[id]==='incoming';if(!adopt)continue;(data.actions[c.sid]??={});(data.actions[c.sid][c.role]??={});let value=data.actions[c.sid][c.role];if(c.phase==='first'&&exists(value.first)&&value.first!==c.idx)delete value.later;value[c.phase]=c.idx;n++}data.log.push({text:`Team comparison: ${n} explicitly accepted additions/revisions; no reflection imported.`});ui.mergeInput=null;ui.conflictSelections={};persist();note('Team decisions reconciled');navigate('review')}
function sceneHTML(s){if(ui.phase==='story')return showStory(s);if(ui.phase==='roles')return showRoles(s);if(ui.phase==='first')return showDecision(s,'first');if(ui.phase==='impact')return showImpact(s);if(ui.phase==='later')return showLater(s);if(ui.phase==='later-choice')return showDecision(s,'later-choice');if(ui.phase==='observer')return showObserver(s);if(ui.phase==='situation')return showSituation(s);if(ui.phase==='reflection')return showReflection(s);return showStory(s)}
function render(scroll=true){let app=document.getElementById('app');if(ui.screen==='map')app.innerHTML=showMap();else if(ui.screen==='review')app.innerHTML='<div class="block">'+showReview()+'</div>';else if(ui.screen==='team')app.innerHTML='<div class="block">'+showTeam()+'</div>';else if(ui.screen==='about')app.innerHTML='<div class="block">'+showAbout()+'</div>';else if(ui.screen==='scene')app.innerHTML='<div class="block">'+sceneHTML(byId(ui.sid))+'</div>';document.querySelectorAll('.nav [data-action]').forEach(x=>x.classList.toggle('active',x.dataset.action===ui.screen));if(scroll)window.scrollTo(0,0)}

function commit(stage){let s=byId(ui.sid),r=currentRole(s),isLater=stage==='later-choice',idx=isLater?ui.pendingLater:ui.pending,choices=isLater?r.followups:r.choices;if(!exists(idx)||!choices[idx])return;(data.actions[s.id]??={});(data.actions[s.id][r.id]??={});let key=isLater?'later':'first',row=data.actions[s.id][r.id],prior=row[key];if(exists(prior)&&prior!==idx&&!isLater)delete row.later;row[key]=idx;let verb=!exists(prior)?'Committed':prior===idx?'Reconfirmed':'Revised';data.log.push({sid:s.id,role:r.id,stage:key,idx,text:`${verb} ${s.id} ${r.name} ${key}: ${choices[idx].title}${!isLater&&exists(prior)&&prior!==idx?' (only this role’s later response cleared)':''}`});persist();ui.pending=null;ui.pendingLater=null;ui.phase=isLater?'reflection':'impact';render();note('Role-specific response recorded')}
function commitPlan(){let ids=ui.budgetDraft===null?(data.allocation?.ids||[]):ui.budgetDraft;data.allocation={ids:ids.slice(),signature:signature(),recordedValue:ids.reduce((n,id)=>n+investmentCost(id),0),status:'proposal only'};data.log.push({text:`Scenario 10: recorded discretionary proposal (${ids.join(', ')||'no new initiative'}), ${data.allocation.recordedValue}/5 units; no real funds committed.`});persist();ui.budgetDraft=null;render(false);note('Planning proposal recorded, not approved')}

function saveSwitch(value){ui.save=value;try{if(!value)localStorage.removeItem(STORE);else persist();note(value?'Device saving enabled':'Device saving disabled; stored copy cleared')}catch(e){note('Local storage unavailable')}render(false)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el||el.tagName==='INPUT')return;let a=el.dataset.action;if(['map','review','team','about'].includes(a))navigate(a);else if(a==='open')openScene(el.dataset.id);else if(['story','roles','first','later','later-choice','observer','situation','reflection'].includes(a))phase(a);else if(a==='story-next'){ui.storyBeat=Math.min((ui.storyBeat||0)+1,byId(ui.sid).intro.length-1);render()}else if(a==='story-prev'){ui.storyBeat=Math.max((ui.storyBeat||0)-1,0);render()}else if(a==='pick-role')pickRole(el.dataset.role);else if(a==='pending'){ui.pending=Number(el.dataset.idx);render(false)}else if(a==='pending-later'){ui.pendingLater=Number(el.dataset.idx);render(false)}else if(a==='observe-beat'){ui.observerBeat=Number(el.dataset.idx);render(false)}else if(a==='commit')commit(el.dataset.stage);else if(a==='toggle-plan')togglePlan(el.dataset.id);else if(a==='commit-plan')commitPlan();else if(a==='skip-plan'){ui.budgetDraft=null;note('The discretionary proposal remains open');render(false)}else if(a==='export')exportPrivate();else if(a==='export-team')downloadTeam();else if(a==='print')window.print();else if(a==='reset-team'){ui.mergeInput=null;ui.conflictSelections={};render(false)}else if(a==='preview-team'){let raw=document.getElementById('teamInput')?.value||'';try{if(raw.length>250000)throw Error('Dossier is too large');ui.mergeInput=validateTeam(JSON.parse(raw));ui.conflictSelections={};render(false);note('Dossier validated; compare conflicts')}catch(err){note('Import error: '+String(err.message).slice(0,130))}}else if(a==='apply-team')applyTeam();else if(a==='clear'){if(confirm('Clear all locally recorded decisions, reflections, team state and history?')){data=fresh();ui.save=false;ui.mergeInput=null;try{localStorage.removeItem(STORE)}catch(e){}navigate('map');note('Session cleared')}}});
document.addEventListener('input',e=>{let k=e.target.dataset.ref;if(k){let sid=ui.sid;(data.reflections[sid]??={})[k]=e.target.value.slice(0,6000);persist()}});
document.addEventListener('change',e=>{if(e.target.matches('input[data-action="save"]'))saveSwitch(e.target.checked);if(e.target.dataset.conflict)ui.conflictSelections[e.target.dataset.conflict]=e.target.value});
render();
</script></body></html>
