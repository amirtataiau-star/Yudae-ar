<style>

.object-detail{scroll-margin-top:16px}.model-panel:not(.model-ready){min-height:330px}.object-grid{grid-template-columns:repeat(2,minmax(0,1fr))}model-viewer{outline:none}.hotspot{touch-action:manipulation}.hotspot:active{background:#e9d28d;color:#233637}

<div id="app">
<header><div class="brand">YUDAE <span>/ SPATIAL PLÆTHRU</span></div><button class="smallbutton" type="button" data-action="home" aria-label="Return to introduction">Start</button></header><aside style="padding:12px 20px"><a href="./commons-v05.html" style="color:#c9e7cc">Explore the new interactive Commons courtyard · v0.5 →</a></aside>
<main id="screen" aria-live="polite"></main>
<footer>Fictional 2030 vignette · Non-canonical test scene · No scores, no AI, no data sent · Phone AR depends on browser/device and HTTPS</footer>
</div>
<script>
'use strict';
const MODELS={"intro":"assets/yudae_intro.glb","p_clinic":"assets/yudae_p_clinic.glb","p_shuttle":"assets/yudae_p_shuttle.glb","p_commons":"assets/yudae_p_commons.glb","e_clinic_open":"assets/yudae_e_clinic_open.glb","e_clinic_direct":"assets/yudae_e_clinic_direct.glb","e_shuttle_open":"assets/yudae_e_shuttle_open.glb","e_shuttle_direct":"assets/yudae_e_shuttle_direct.glb","e_commons_open":"assets/yudae_e_commons_open.glb","e_commons_direct":"assets/yudae_e_commons_direct.glb"};

const DETAILED_MODELS=Object.fromEntries(Object.entries(MODELS).map(([key,path])=>[key,path.replace(/\.glb$/,"_detailed.glb")]));
const EMBEDDED_MODELS = null;
const pageOrder=['welcome','perspective','encounter','explore','decision1','after1','decision2','ending','reflect'];
const labels={clinic:'Clinic refrigerator',shuttle:'School shuttle dispatch',commons:'Commons information desk'};
const character={
 rae:{name:'Rae',role:'Clinic aide',color:'#e3a89d',initial:'R',intro:'You have spent the last hour holding the clinic together. You know the cold storage remains sealed, but cannot confirm how long the remaining backup will last. Leaving your patients to attend a public meeting is not a neutral choice.',testimony:'The temperature logger went dark twelve minutes ago. The last reading was safe, but the buffer might be shorter than people think. I can transfer supplies if we find transport and another suitable unit.',position:'Clinic continuity; accountable for people who cannot leave.'},
 imani:{name:'Imani',role:'Transport coordinator',color:'#f1d08e',initial:'I',intro:'You coordinate transport with a radio nearly out of charge. Families have been told there is a shuttle, but the route has changed twice. You can act on dispatch information, not on rumours about every household.',testimony:'I have a probable alternative route for the shuttle, but the driver cannot hear it until we recharge dispatch. Some households have a second plan. Two have not replied.',position:'Transport routing; cannot promise the road is open.'},
 sol:{name:'Sol',role:'Commons steward',color:'#89d2bf',initial:'S',intro:'You are the Commons steward tonight. Several people depend on the public text notice because phone calls and spoken announcements do not reach everyone. You can recommend an allocation, but the site team must agree to move the only working battery.',testimony:'The notice desk can send text updates if it has power. A handwritten sign helps people physically here, but several residents have been displaced and will never see it.',position:'Local coordination; cannot speak for absent residents.'}
};
const options={
 clinic:{title:'Recommend the clinic first',detail:'The refrigerator regains stable power for the next interval. Dispatch and the Commons desk remain uncertain.',immediate:'The site stewards agree to connect the battery to the clinic. Rae checks the logger and sees it resume. She cannot yet tell whether the supplies will remain within limits after this window. Across the road, Imani keeps trying her silent handset.',facts:['Clinic power restored for this interval','Dispatch radio uncharged','Information desk dark']},
 shuttle:{title:'Recommend dispatch first',detail:'Radio coordination becomes possible. Clinic cold storage and the Commons desk are left on their remaining arrangements.',immediate:'Imani gets enough charge to contact the driver. The vehicle answers from an unexpected side road. The route is not yet confirmed safe; at the clinic, Rae starts organising a possible transfer rather than waiting for reassurance.',facts:['Dispatch radio restored temporarily','Clinic stability uncertain','Information desk dark']},
 commons:{title:'Recommend the Commons desk first',detail:'Text information can circulate. Clinic and shuttle staff must manage without the shared battery for now.',immediate:'Sol reopens the text desk and begins correcting yesterday’s shelter notice. Families can send new information. At the clinic, a second power alarm sounds; at dispatch, the handset remains silent.',facts:['Text notice desk active','Clinic backup uncertain','Dispatch radio uncharged']}
};
const responses={
 open:{title:'Post an accessible public status',detail:'Explain what is powered and what is unresolved, without names or personal details. It takes time to verify wording.',note:'A plain-language notice goes onto the Commons board and text feed where available. People can correct the account and coordinate help, but it takes additional minutes and the information may not reach everyone.'},
 direct:{title:'Contact affected households directly',detail:'Ask stewards to give targeted updates first. Privacy and speed improve, but people outside the contact network may miss information.',note:'Stewards contact households and services they can reach. They protect sensitive details and move quickly. People not in their network may still rely on an inaccurate account of what the town can provide.'}
};
const endingText={
 'clinic_open':'The clinic has power for now. A neighbour reading the notice offers an insulated transfer box, but Rae has not verified whether it meets the clinic’s requirements. A parent posts that the shuttle is missing. Imani gets a new lead, not a working radio. The public account makes gaps visible without guaranteeing they close.',
 'clinic_direct':'The clinic buys time. Rae is able to organise a discreet supply check with a nearby service. Imani learns the battery was moved only when she reaches a steward; several families still believe transport is operating normally. The targeted contacts preserve privacy, while gaps in the wider picture persist.',
 'shuttle_open':'Imani reaches the driver and sends a proposed route. An updated notice enables two families to move to the new collection point; a third has not responded. Rae begins a transfer request for the cold storage. The information is shared, but power has not followed it to the clinic.',
 'shuttle_direct':'The driver receives a route update. Stewards contact the families whose details they have and avoid publishing a vulnerable household’s location. Another parent arrives at the old stop, unaware the plan changed. Rae is still arranging an alternative for the clinic fridge.',
 'commons_open':'The public text desk and notice board carry corrected information. Two residents offer a solar charger, but nobody has tested it against the clinic’s requirements. Imani receives a reported sighting of the shuttle, not confirmation. The Commons becomes more answerable without becoming more powerful.',
 'commons_direct':'The Commons desk remains powered while stewards use it to contact known households and the clinic. Rae receives a message about an available cold box, but compatibility is unknown. Someone at the school sees no update and assumes transport is running. Better privacy and local coordination leave a public information gap.'
};
const lenses={
 experience:'Whose account feels credible in this version? Compare what people experienced with what you can verify. A different perspective changes knowledge, not automatically the event.',
 conditions:'The battery, available adapters, routes, notice formats and working relationships shape what is feasible. Which missing condition would change the available choices?',
 capacity:'Rae cannot leave patients; Imani cannot drive the shuttle remotely; Sol cannot reach every absent resident. Who is being asked to carry responsibility without enough capacity?',
 possibility:'Which option becomes possible only after new information or a repaired connection? Which possibility remains open even after your recommendation?',
 relational:'What changed between households, services and stewards? Whose account reached the wider network, and whose stayed outside it?',
 answerability:'What would you need to revisit or publicly correct before this allocation can be defended to affected people?'
};

const evidence={
 logger:{title:'Cold-storage logger',zone:'Clinic',loc:'-1.08m 0.41m -0.72m',notice:'The display is dark. The last recorded temperature was safe, but the timestamp is twelve minutes old.',limits:'A last safe reading cannot establish current storage conditions or what happened between readings.',who:'Rae can check the supply log, but must remain with patients. A qualified person must confirm storage requirements.',request:'Ask Rae to prepare a transfer inventory',cost:'Rae uses scarce attention to list at-risk supplies; this does not certify their condition.'},
 route:{title:'Shuttle route slate',zone:'Dispatch',loc:'0.98m 0.41m -0.75m',notice:'Two routes are crossed out. A third is pencilled in, with a question mark at the river crossing.',limits:'A mark on a map is a proposed route, not proof that the driver or the road is reachable.',who:'Imani knows the dispatch plan, not the road condition; the driver can report directly if the radio works.',request:'Ask Imani to prepare a route check',cost:'Imani prioritises one route check. Without a working radio, confirmation remains delayed.'},
 notice:{title:'Old public notice',zone:'Commons',loc:'-0.28m 0.44m 0.84m',notice:'Yesterday’s shuttle time is still posted, with a later handwritten correction partly covering it.',limits:'Seeing a notice does not establish who read it. Replacing it does not reach displaced residents.',who:'Sol knows which versions circulated at the Commons, but cannot confirm every resident received the correction.',request:'Ask a steward to reconcile the posted times',cost:'A steward is allocated to verify and rewrite the board, reducing time for other tasks.'},
 junction:{title:'Battery junction',zone:'Commons yard',loc:'0.43m 0.26m 0.55m',notice:'Only one safe active outlet is labelled. Two improvised cables are bundled nearby.',limits:'The existence of cables does not establish that a split is safe or technically feasible.',who:'The site team controls connections; nobody should improvise electrical work on the basis of this model.',request:'Ask the site team to confirm safe connectors',cost:'Someone with appropriate competence inspects the connections. No unsafe rewiring is attempted.'},
 ledger:{title:'Household contact record',zone:'Commons desk',loc:'0.13m 0.44m 0.75m',notice:'Several households have confirmed receipt. Two entries have no reply; others have no current number.',limits:'A contact list is partial, potentially outdated and sensitive. This view exposes no personal details.',who:'Sol can authorise a careful contact check but cannot assume that silence means people are safe.',request:'Ask for a reachability check',cost:'A steward compares opt-in contact pathways, using time that might otherwise go to transport support.'},
 charger:{title:'Unverified solar charger',zone:'Clinic roof',loc:'-0.84m 0.46m -0.77m',notice:'A small portable solar unit sits beside a mismatched adapter. Its rating is unreadable from here.',limits:'Available equipment is not the same as compatible, charged or clinically safe power.',who:'The clinic and a suitably competent technician would need to establish compatibility, load and suitability.',request:'Ask someone to test a backup-power lead',cost:'A volunteer seeks a safe compatibility check rather than treating the charger as an instant solution.'}
};
const evidenceOrder=['logger','route','notice','junction','ledger','charger'];
function reportFor(key){
 if(!S.priority)return 'No battery allocation yet. The observation changes what you can ask, not the material conditions.';
 const power=S.priority;
 const response=S.response;
 const states={
  logger:power==='clinic'?'Power resumes at the clinic, but the unseen interval remains unverified.':'The logger is still dark; Rae is considering an external transfer and monitoring what she can.',
  route:power==='shuttle'?'The radio reaches the driver. A reported obstruction means the pencilled route needs revision.':'The pencilled route remains unconfirmed; the radio has not recovered.',
  notice:response==='open'?'A corrected status is prepared, but confirming which versions reached residents remains unfinished.':response==='direct'?'Direct contacts begin; the old public posting may still mislead people.':'The older public notice is still visible and may mislead arrivals.',
  junction:'The site team has made one connection operational; the others do not become powered simply because a cable is visible.',
  ledger:response==='direct'?'Known households are contacted first. Missing and nonresponsive households are not automatically covered.':response==='open'?'An accessible general status is prepared. Delivery and comprehension are not confirmed for absent households.':'The record still has unanswered entries and outdated pathways.',
  charger:'Backup availability remains uncertain until suitability is checked; the current allocation cannot assume it works.'
 };
 return states[key];
}
function inquiryOutcome(){
 const key=S.followUp;if(!key)return '';
 const alloc=S.priority||null,channel=S.response||null;
 const result={
 logger:alloc==='clinic'?'Rae completes a priority inventory while the logger resumes. The temperature gap still needs specialist verification.':'Rae identifies items needing urgent review. Without reliable monitoring or confirmed transport, the inventory does not settle their safety.',

function wireViewer(v){
 if(!v)return;
 const panel=v.closest('.model-panel');
 const notice=document.getElementById('modelNotice');
 const loading=panel.querySelector('.loadingScene');
 let finished=false, fallback=false;
 const say=text=>{if(v.isConnected){notice.textContent=text;loading.textContent=text;}};
 const timer=setTimeout(()=>{
  if(!v.isConnected||finished)return;
  say(!customElements.get('model-viewer')
   ? 'The viewer software is still unavailable. Check your connection, then Retry 3D loading. You can also use the accessible map.'
   : 'The town has not finished loading. You can keep waiting, choose Simpler, or retry. The accessible map remains available.');
 },20000);
 v.addEventListener('progress',e=>{
  if(!finished && e.detail && e.detail.totalProgress>0) say('Loading town: '+Math.round(e.detail.totalProgress*100)+'%');
 });
 v.addEventListener('load',()=>{
  finished=true;clearTimeout(timer);panel.classList.add('model-ready');
  notice.textContent=(fallback?'Simpler town loaded after the detailed model failed.':'Town loaded.')+' Drag to rotate; select a numbered object to inspect it.';
 });
 v.addEventListener('error',e=>{
  if(!v.isConnected)return;
  const type=e.detail&&e.detail.type;
  if(!fallback && S.detail!==false && type==='loadfailure'){
   fallback=true;S.detail=false;persist();
   document.querySelectorAll('[data-action="detail"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value==='low')));
   say('Detailed town could not load. Trying the simpler scene…');v.src=modelPath();return;
  }
  finished=true;clearTimeout(timer);
  say('The 3D viewer could not render this scene'+(type?' ('+type+')':'')+'. Try Simpler or Retry 3D loading. The accessible map is available below.');
 });
 v.addEventListener('ar-status',e=>{if(e.detail&&e.detail.status==='failed')notice.textContent='AR did not start. On Android, try the direct AR link below. Phone AR still requires a compatible device and AR services.';});
 v.querySelectorAll('button.hotspot').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();act('inspect',btn.dataset.value)}));
 // A failed graphics context can leave the custom element blank without a load error.
 try{
  const canvas=document.createElement('canvas');const gl=canvas.getContext('webgl2');
  if(!gl){finished=true;clearTimeout(timer);say('This browser cannot start the graphics engine required for 3D (WebGL 2). Try your phone’s normal browser, use direct Android AR where available, or continue with the accessible map.');}
  else {const ext=gl.getExtension('WEBGL_lose_context');if(ext)ext.loseContext();}
 }catch(e){say('Graphics availability could not be checked. Waiting for the viewer…');}
}

let cameraStream=null;

async function startCamera(){
 const notice=document.getElementById('modelNotice');
 if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  if(notice)notice.textContent='Camera overlay unavailable in this viewer. Open the file in Chrome or Safari on a secure website with camera permissions enabled. The accessible map remains playable.';
  return;
 }
 try{
  stopCamera();
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  const video=document.getElementById('cameraLayer');
  if(!video||S.page!=='explore'||S.view!=='3d') {stream.getTracks().forEach(track=>track.stop());return;}
  cameraStream=stream;
  video.srcObject=stream;
  await video.play();
  const panel=document.getElementById('modelPanel');if(panel)panel.classList.add('is-camera');
  const viewer=document.getElementById('viewer');if(viewer)viewer.autoRotate=false;
  document.getElementById('startCamera').hidden=true;
  document.getElementById('stopCamera').hidden=false;
  if(notice)notice.textContent='Camera overlay running. Move your phone to see the room; rotate or resize the model with touch. This is a visual overlay, not AR surface tracking.';
 }catch(err){
  stopCamera();
  if(notice)notice.textContent=err&&err.name==='NotAllowedError'?'Camera permission was denied. Allow camera access in browser settings and try again.':'Could not open the camera ('+(err?.name||'unavailable')+'). Try Chrome on Android or Safari on iPhone; otherwise use the 3D model or accessible map.';
 }
}

 case 'decision2': h=`${header('decision2',5)}<div class="eyebrow">Second decision / coordinate</div><h2>Who needs to know?</h2><p>The first connection is operating, for now. A volunteer asks what to tell people. Sharing too little can exclude people; sharing carelessly can expose details that should stay private. Any earlier inquiry has already consumed some of the team’s attention.</p><div class="callout"><strong>Inherited condition</strong><p>You recommended power for: ${labels[S.priority]}. The other sites still face their own constraints.</p></div>${['open','direct'].map(k=>`<button type="button" class="choice" data-action="response" data-value="${k}"><span class="label">Coordination pathway</span><span class="title">${responses[k].title}</span><span class="details">${responses[k].detail}</span></button>`).join('')}`;break;
 case 'ending': h=`${header('ending',6)}<div class="eyebrow">Consequences / provisional</div><h2>The town moves unevenly.</h2><p>${responses[S.response].note}</p><div class="callout"><strong>What followed</strong><p>${endingText[`${S.priority}_${S.response}`]}</p></div>${inquirySummary()}<div class="state-line"><span class="pill">Allocation · ${labels[S.priority]}</span><span class="pill">Communication · ${S.response==='open'?'public':'targeted'}</span><span class="pill">Future support · unconfirmed</span></div><div class="actions">${action('See the result in AR / 3D','see-end','secondary')}${action('Examine what changed','to-reflect')}${action('Reconsider the second decision','revise-second','minor')}</div>`;break;
 case 'reflect': h=`${header('reflect',6)}<div class="eyebrow">Reconsider and continue</div><h2>What did the scene make possible?</h2><p>Your sequence is recorded locally as authored causal and information changes. It is not a personality assessment or a measure of how ethically you behaved.</p><div class="card"><h3>Path taken</h3><p><strong>Perspective:</strong> ${character[S.role].name}.<br><strong>Initial recommendation:</strong> ${labels[S.priority]}.<br><strong>Coordination:</strong> ${responses[S.response].title}.</p><p class="quiet">${S.history.length} recorded event(s), including superseded choices and inquiries.</p>${discoverySummary()}${inquirySummary()}<details><summary>Inspect the decision record</summary><ol>${S.history.map(e=>`<li>${({priority:'First connection',response:'Coordination',observed:'Observed',inquiry:'Focused inquiry'})[e.step]||e.step}: ${e.value}. ${e.superseded?'(superseded)':''}</li>`).join('')}</ol></details></div><h3>Optional awareness lens</h3><p class="quiet">A qualitative agential-wellbeing filter. No colours for moral standing, scores, diagnoses or universal best move.</p><div class="awareness">${Object.keys(lenses).map(k=>`<button class="awarebtn ${S.lens===k?'selected':''}" data-action="lens" data-value="${k}" type="button">${k.charAt(0).toUpperCase()+k.slice(1)} ${S.lens===k?'✓':''}</button>`).join('')}</div>${S.lens?`<div class="callout">${lenses[S.lens]}</div>`:''}<label for="journal" class="mini-head">What would you need to learn or change before acting again?</label><textarea class="note" id="journal" placeholder="Your reflection stays on this device; nothing is submitted."></textarea><p class="quiet">The point is to notice shifting possibilities, limits and obligations—not to identify a winning personality or route.</p><div class="actions">${action('Revisit the spatial result','see-end','secondary')}${action('Reconsider the first decision','revise-first','minor')}${action('Try a different perspective','revise-role','minor')}${action('Begin again with a fresh path','reset','minor')}</div>`;break;
 }
 root.innerHTML=h;
 if(S.page==='reflect'){const note=root.querySelector('#journal');note.value=S.note||'';note.addEventListener('input',e=>{S.note=e.target.value;persist()})}
 if(S.page==='explore'&&S.view==='3d') wireViewer(root.querySelector('model-viewer'));

}
function log(step,value){for(const e of S.history){if(step!=='observed'&&e.step===step&&!e.superseded)e.superseded=true}S.history.push({step,value,superseded:false})}
function back(){const p=S.page;go({perspective:'welcome',encounter:'perspective',explore:S.returnTo||'encounter',decision1:'encounter',after1:'decision1',decision2:'after1',ending:'decision2',reflect:'ending'}[p]||'welcome')}
function refreshInspection(){const mount=document.getElementById('inspectionMount');if(mount)mount.innerHTML=inspectPanel();document.querySelectorAll('.hotspot[data-value]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===S.objectFocus)))}
function act(action,value){switch(action){
 case 'home':go('welcome');break;
 case 'back':back();break;
 case 'begin':go('perspective');break;
 case 'preview':S.view='3d';S.returnTo='welcome';go('explore');break;
 case 'role':S.role=value;S.focus=null;persist();render();break;
 case 'to-encounter':if(!S.role)break;S.focus=null;go('encounter');break;
 case 'ask':S.focus=S.focus===value?null:value;if(!S.asked.includes(value))S.asked.push(value);persist();render();break;
 case 'to-explore':S.view='3d';S.focus=null;S.returnTo='decision1';go('explore');break;
 case 'to-decision1':S.focus=null;go('decision1');break;
 case 'leave-explore':go(S.returnTo||'decision1');break;
 case 'retry-viewer':viewerWarning=false;render();break;
 case 'view':S.view=value;viewerWarning=false;persist();render();break;
 case 'detail':S.detail=value!=='low';viewerWarning=false;persist();render();break;
 case 'camera-start':void startCamera();break;
 case 'camera-stop':stopCamera();{const n=document.getElementById('modelNotice');if(n)n.textContent='Camera stopped. Continue in 3D or try again.';}break;
 case 'place':S.focus=S.focus===value?null:value;persist();render();break;
 case 'inspect':if(!evidence[value])break;S.objectFocus=S.objectFocus===value?null:value;if(!S.inspected.includes(value)){S.inspected.push(value);log('observed',value);}persist();refreshInspection();if(S.objectFocus)document.getElementById('objectDetail')?.scrollIntoView({block:'start',behavior:'smooth'});break;
 case 'follow-up':if(!evidence[value]||S.priority)break;S.followUp=S.followUp===value?null:value;log('inquiry',S.followUp||'withdrawn');persist();refreshInspection();document.getElementById('objectDetail')?.scrollIntoView({block:'start',behavior:'smooth'});break;
 case 'priority':S.priority=value;S.response=null;log('priority',value);go('after1');break;
 case 'see-mid':S.returnTo='after1';S.view='3d';go('explore');break;
 case 'to-decision2':go('decision2');break;
 case 'response':S.response=value;log('response',value);go('ending');break;
 case 'see-end':S.returnTo=S.page==='reflect'?'reflect':'ending';S.view='3d';go('explore');break;
 case 'to-reflect':go('reflect');break;
 case 'revise-first':S.response=null;S.priority=null;S.history.forEach(x=>{if(['priority','response'].includes(x.step)&&!x.superseded)x.superseded=true});go('decision1');break;
 case 'revise-second':S.response=null;S.history.forEach(x=>{if(x.step==='response'&&!x.superseded)x.superseded=true});go('decision2');break;
 case 'revise-role':S.role=null;S.focus=null;go('perspective');break;
 case 'lens':S.lens=S.lens===value?null:value;persist();render();break;
 case 'reset':{if(confirm('Start over? This clears the current choices, decision history and local reflection.')){S={...EMPTY};persist();go('welcome')}}break;
}}
document.addEventListener('click',function(e){let t=e.target.closest('[data-action]');if(t)act(t.dataset.action,t.dataset.value||null)});
render();
</script>
</body>
</html>
